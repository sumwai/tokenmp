# 本机与 CI 的工具链版本锁定。
#
# 本机存在一个容易踩的坑：mise 里虽然装了 go，但在本目录未激活时 shim 会穿透到
# /usr/bin/go —— 那是 Omarchy 打包的非上游构建（版本串形如 go1.27.0-X:nodwarf5，
# 不带 DWARF 调试信息）。锁定本文件后 `mise install` 一次装齐，go 走 mise 的上游版本，
# 本机、CI 与容器三处编译结果一致。
#
# node 一并锁定，供仓库内前端工具链取用。
[tools]
go = "1.27"
golangci-lint = "2.14.0"
goreleaser = "2.18.2"
node = "26.8.1"
