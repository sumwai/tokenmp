name: PR 标题

# release-please 与 changelog 靠提交类型的前缀归类并定版号。
# 采用 squash 合并时，PR 标题会成为进入 main 的那条提交信息 —— 标题不合规范，
# 版本号与变更记录就会归到错误的分区，因此在 PR 阶段拦下。
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# 最小权限：只读取 PR 元数据并输出结论。
permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: 校验标题符合 Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # 与 release-please-config.json 的 changelog-sections 保持同一套 type。
        # 用 shell 正则而不是第三方 action：规则简单，不值得为它引入一个外部依赖。
        run: |
          pattern='^(feat|fix|perf|refactor|docs|deps|revert|test|build|ci|chore|style)(\([a-z0-9-]+\))?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error title=PR 标题不符合 Conventional Commits::格式为 <type>(<scope>): <描述>，type 见 CONTRIBUTING.md；当前标题：$TITLE"
            exit 1
          fi
