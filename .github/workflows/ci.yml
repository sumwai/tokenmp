name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：本工作流只读仓库，不需要写任何东西。
permissions:
  contents: read

# 同一分支上的旧运行被新提交取代时直接取消，避免堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 只装 make check 真正需要的两个工具。
      # install: false 是有意的：默认会把 .mise.toml 里的 goreleaser 与 node 一并装上，
      # 而本工作流用不到它们 —— 每次 CI 多下几十 MB、多花几十秒，只为装不用的东西。
      # 发布链路需要 goreleaser 时由 release.yml 自己装。
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise install go golangci-lint

      # mise 与 .mise.toml 是版本唯一真相：本地与 CI 用同一份锁定，
      # 不会出现「本地能过、CI 报另一个 lint 规则」这类版本漂移。
      - run: make check

  # 真实 MySQL 上的迁移、事务与端到端运营剧本验证。check 的契约是无外部依赖，
  # 所以结算事务、FOR UPDATE 锁、JSON 聚合以及「入驻→调用→扣费→对账」全链
  # 只能在数据库上验的路径放在独立 job：CI 强制跑，本机仍可不装 MySQL。
  #
  # 剧本并入本 job 而不是另开一个：两者都需要一份 MySQL service，合并后只声明一份，
  # 两个 make 目标串行执行、各自跑前跑后清库，不会互相打扰；任一失败同样阻断合并。
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tokenmp-ci
          MYSQL_DATABASE: tokenmp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptokenmp-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise install go golangci-lint
      - run: make check-integration
        env:
          # 指向 service 起的可丢弃库：测试会先删表再重建。
          TOKENMP_TEST_MYSQL_DSN: root:tokenmp-ci@tcp(127.0.0.1:3306)/tokenmp_test?parseTime=true

      # 端到端运营剧本。与上一步共用同一份 MySQL service 与 DSN 口径；
      # 剧本用独立的构建标签与目标，跑前跑后都清库，因此两步串行不会互相影响。
      - run: make e2e
        env:
          TOKENMP_TEST_MYSQL_DSN: root:tokenmp-ci@tcp(127.0.0.1:3306)/tokenmp_test?parseTime=true
