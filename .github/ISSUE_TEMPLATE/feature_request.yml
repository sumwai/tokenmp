name: 需求建议
description: 提出新的能力或行为改进
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前行为下无法完成什么，或代价是什么
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 完成后的可观察结果，尽量给出输入与输出示例
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的其他做法及其不被采纳的原因

  - type: textarea
    id: context
    attributes:
      label: 其他上下文
      description: 相关 Issue、文档或使用场景
