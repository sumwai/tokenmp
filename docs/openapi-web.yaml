      description: |
        为本商家登记一份上游凭据，归属写死为会话推导出的商家。明文只在本次响应出现一次，
        之后任何端点都不再返回；列表只给出前缀。凭据按 `cred_group` 与渠道关联：
        同分组的渠道共享这一份凭据。
      operationId: createPartnerCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartnerCredentialRequest"
      responses:
        "200":
          description: 登记成功，响应携带一次性明文。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreatedPartnerCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/partner/credentials/{id}/enable:
    post:
      tags: [partner]
      summary: 启用上游凭据
      description: |
        启用一份属于本商家的凭据；已启用的凭据再次启用同样返回成功。
        不属于本商家的凭据返回 `code=404`，不以 403 区分存在性。
      operationId: enablePartnerCredential
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: 启用成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/partner/credentials/{id}/disable:
    post:
      tags: [partner]
      summary: 停用上游凭据
      description: |
        停用一份属于本商家的凭据；已停用的凭据再次停用同样返回成功。
        不属于本商家的凭据返回 `code=404`，不以 403 区分存在性。
      operationId: disablePartnerCredential
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: 停用成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/partner/usage/stats:
    get:
      tags: [partner]
      summary: 名下调用量与应扣量聚合
      description: |
        按维度把区间内本商家名下渠道的调用量与应扣量合计起来。口径与账户面的用量聚合一致：
        分组维度 `day` 取日期（`YYYY-MM-DD`，按写入时刻所在的自然日）、`model` 取客户端请求
        的模型名、`api_key` 取密钥 id 的十进制文本；合计与流水同源，只是作用域换成商家。

        它只回答合计，不返回单条流水。
      operationId: getPartnerUsageStats
      parameters:
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: group_by
          in: query
          required: false
          description: 分组维度；缺省 `day`。
          schema:
            type: string
            enum: [day, model, api_key]
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/ApiKeyFilter"
      responses:
        "200":
          description: 聚合合计，按 `key` 升序。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfUsageStatsItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/partner/settlement:
    get:
      tags: [partner]
      summary: 分账对账单
      description: |
        返回本商家一个账期的分账对账单：账期、成交笔数与四处金额（卖出总额、平台抽成、
        上游成本、商家收益）。作用域由会话推导，不接受商家参数；非本商家的数据不出现。

        账期是左闭右开区间：`from` 与 `to` 一起给出时按该区间出账，都不给时按本商家的
        账期取上一个完整自然周期。金额是十进制字符串（金额 8 位小数、抽成率 4 位），
        口径见 `docs/compatibility.md` 的「分佣与结算口径」。
      operationId: getPartnerSettlement
      parameters:
        - $ref: "#/components/parameters/WindowFrom"
        - $ref: "#/components/parameters/WindowTo"
      responses:
        "200":
          description: 该账期的对账单。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PartnerSettlement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    webSession:
      type: http
      scheme: bearer
      description: |
        会话访问令牌，登录响应的 `data.access_token` 取得，随 `Authorization: Bearer` 提交。
        与数据面的模型 API 密钥是两套独立凭据，不得互换。

  headers:
    # 页面侧的退避提示；与数据面的同名头（docs/openapi.yaml 的 RetryAfter）同一套语义。
    RetryAfter:
      description: |
        触发频率限制（`code=429`）时出现，单位秒：按来源的滑动窗口推算出的最短等待时长。
        页面按它显示等待时间，不做自动重试（web/AGENTS.md 的三态）。
      schema:
        type: integer
        minimum: 1

  schemas:
    BusinessCode:
      type: integer
      description: |-
        业务结果码，取值见 info.description 的业务码表；程序按它分支，不解析 message。
        取值与常量名同时是前端业务码常量的生成来源。
      enum: [200, 400, 401, 402, 403, 404, 409, 410, 429, 500]
      x-enum-varnames:
        [OK, BadRequest, Unauthorized, PaymentRequired, Forbidden, NotFound, Conflict, ChallengeExpired, TooManyRequests, InternalError]

    Envelope:
      type: object
      description: 页面通信的统一信封，六个字段固定出现。
      required: [code, data, message, page, size, total]
      properties:
        code:
          $ref: "#/components/schemas/BusinessCode"
        data:
          description: 业务数据，结构由各端点声明；无数据时省略或为 null。
        message:
          type: string
          description: 面向用户的文案；程序不得按它分支。
        page:
          type: [integer, "null"]
          description: 当前页码，从 1 起；非列表端点为 null。
        size:
          type: [integer, "null"]
          description: 每页条数；非列表端点为 null。
        total:
          type: [integer, "null"]
          description: 总条数；非列表端点为 null。

    EncryptedSecret:
      type: string
      description: 经一次性公钥 RSA-OAEP（SHA-256）加密后的 base64 密文。
      contentEncoding: base64

    Fingerprint:
      type: string
      minLength: 8
      maxLength: 128
      description: |
        客户端本地生成并持久化的指纹，同时充当一次性密钥的标识：
        取公钥时提交它作为索引，提交密文时携带同一值供服务端定位私钥。

    ChallengeData:
      type: object
      required: [algorithm, hash, public_key, expires_in]
      properties:
        algorithm:
          type: string
          const: RSA-OAEP
        hash:
          type: string
          const: SHA-256
        public_key:
          type: string
          description: SPKI DER 格式的 base64 公钥。
        expires_in:
          type: integer
          description: 密钥有效期，单位秒。
      additionalProperties: false

    SigninRequest:
      type: object
      required: [username, password, fingerprint]
      properties:
        username:
          type: string
          description: 账号标识（邮箱或手机号）。
        password:
          $ref: "#/components/schemas/EncryptedSecret"
        fingerprint:
          $ref: "#/components/schemas/Fingerprint"
      additionalProperties: false

    SignupRequest:
      type: object
      required: [email, username, password, fingerprint]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 2
          maxLength: 64
        password:
          $ref: "#/components/schemas/EncryptedSecret"
        fingerprint:
          $ref: "#/components/schemas/Fingerprint"
      additionalProperties: false

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
      additionalProperties: false

    SessionTokens:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: 访问令牌，随 Authorization 头提交。
        refresh_token:
          type: string
          description: 刷新令牌，一次性轮换。
        expires_in:
          type: integer
          description: 访问令牌有效期，单位秒。
        user:
          $ref: "#/components/schemas/SessionUser"
      additionalProperties: false

    AccessTokenData:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: 访问令牌有效期，单位秒。
      additionalProperties: false

    SessionUser:
      type: object
      required: [id, username, roles, capabilities, identities]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        roles:
          type: array
          description: |
            主体持有的身份集合，叠加而非互斥：`member` 是所有主体的基线（注册默认），
            `partner` 是申请制的商家身份，`admin` 是平台管理员且同时持有前两者。
            顺序固定为基线在前。取值由服务端下发，前端按 `capabilities` 渲染导航与
            权限，不按身份取值分支，也不硬编码。
          items:
            type: string
            enum: [member, partner, admin]
        capabilities:
          type: array
          description: |
            主体持有的能力标识，为各身份能力的并集，与 `ConsoleData.capabilities`
            同取值域；同样只增不改语义，未识别的取值一律忽略。
          items:
            type: string
        identities:
          type: array
          description: 已绑定的登录身份，`password` 表示已设密码，其余为第三方提供方标识。
          items:
            type: string
      additionalProperties: false

    AuthProvider:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: 提供方标识，用于 `oauth` 与 `exchange` 端点的 `provider` 参数。
        name:
          type: string
          description: 展示名。
      additionalProperties: false

    SendOtpRequest:
      type: object
      required: [email, purpose]
      properties:
        email:
          type: string
          format: email
        purpose:
          type: string
          enum: [reset, erase]
          description: 验证码用途：`reset` 重置密码，`erase` 注销账号；两者不可混用。
      additionalProperties: false

    EraseRequest:
      type: object
      required: [otp]
      properties:
        otp:
          type: string
          description: 经 `purpose=erase` 获取的一次性验证码。
      additionalProperties: false

    ResetRequest:
      type: object
      required: [email, otp, password, fingerprint]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          description: 经 `purpose=reset` 获取的一次性验证码。
        password:
          $ref: "#/components/schemas/EncryptedSecret"
        fingerprint:
          $ref: "#/components/schemas/Fingerprint"
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      required: [current_password, current_fingerprint, new_password, new_fingerprint]
      properties:
        current_password:
          $ref: "#/components/schemas/EncryptedSecret"
        current_fingerprint:
          $ref: "#/components/schemas/Fingerprint"
        new_password:
          $ref: "#/components/schemas/EncryptedSecret"
        new_fingerprint:
          $ref: "#/components/schemas/Fingerprint"
      additionalProperties: false

    # ------------------------------------------------------------------
    # 用户级业务数据
    # ------------------------------------------------------------------
    ConsoleData:
      type: object
      description: 控制台清单：当前主体的导航项、首页段落与能力集合。
      required: [roles, capabilities, navigation, sections]
      properties:
        roles:
          type: array
          description: |
            当前主体持有的身份集合，与 `SessionUser.roles` 同取值域。它只用于展示与
            排障：前端按 `capabilities` 与清单条目渲染，不按身份取值分支。
          items:
            type: string
        capabilities:
          type: array
          description: |
            当前主体持有的能力标识，为各身份能力的并集；取值只增不改语义，
            未识别的取值一律忽略。
          items:
            type: string
        navigation:
          type: array
          description: 底部导航项，按顺序渲染；数量不超过 5。
          items:
            $ref: "#/components/schemas/ConsoleEntry"
        sections:
          type: array
          description: 首页段落，按顺序渲染；条目被过滤光的段落不出现。
          items:
            $ref: "#/components/schemas/ConsoleSection"
      additionalProperties: false

    ConsoleEntry:
      type: object
      description: 一条控制台条目，即一个页面入口。
      required: [title, description, icon, path, capability]
      properties:
        title:
          type: string
        description:
          type: string
          description: 一句话说明；无补充说明时为空串。
        icon:
          type: string
          description: Lucide 图标名（kebab-case）；未登记的名字不渲染图标。
        path:
          type: string
          description: 站内相对路径，用于导航与登录回跳。
        capability:
          type: string
          description: 该条目所需的能力标识；不在 `capabilities` 里时不渲染本项。
      additionalProperties: false

    ConsoleSection:
      type: object
      description: 首页的一个段落。
      required: [title, description, entries]
      properties:
        title:
          type: string
        description:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleEntry"
      additionalProperties: false

    AccountSummary:
      type: object
      description: 账户摘要。字段只增不改语义；与数据面自助查询同口径。
      required: [account, buckets, quotas, recent]
      properties:
        account:
          $ref: "#/components/schemas/AccountRef"
        buckets:
          type: array
          description: |
            可用包存量：未过期且剩余大于 0 的账本行。同单位的包相邻排列，
            不合并成每单位一条合计，因为各包的 fallback 与到期时间不同。
          items:
            $ref: "#/components/schemas/AccountBucket"
        quotas:
          type: array
          description: 生效中的窗口限额行，账户维度在前。
          items:
            $ref: "#/components/schemas/AccountQuota"
        recent:
          type: array
          description: 最近流水摘要，按写入时刻倒序；条数由 `recent` 参数决定。
          items:
            $ref: "#/components/schemas/AccountRecentUsage"
      additionalProperties: false

    AccountRef:
      type: object
      required: [id, code]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
          description: 账户业务编码。
      additionalProperties: false

    AccountBucket:
      type: object
      description: 一条可用包存量。
      required: [unit, remaining, fallback, expires_at]
      properties:
        unit:
          type: string
          description: 结算单位 `currency` / `token` / `credit`。
        remaining:
          type: string
          description: 剩余存量，十进制字符串。
        fallback:
          type: string
          description: 包扣尽后的处置 `charge_balance` / `reject`。
        expires_at:
          type: [string, "null"]
          format: date-time
          description: 到期时刻；`null` 表示不过期。
      additionalProperties: false

    AccountQuota:
      type: object
      description: 一条窗口限额及其当前窗口的已用量。
      required: [scope, metric, window_kind, period, used, limit, action, resets_at]
      properties:
        scope:
          type: string
          description: 限额维度 `account` 或 `api_key`。
        metric:
          type: string
          description: 计量指标。
        window_kind:
          type: string
          description: 窗口类型 `rolling` / `calendar`。
        period:
          type: string
          description: 窗口周期 `5h` / `day` / `week` / `month` / `total`。
        used:
          type: string
          description: 当前窗口已用量，十进制字符串。
        limit:
          type: string
          description: 限额，十进制字符串。
        action:
          type: string
          description: 超限处置 `reject` / `throttle`。
        resets_at:
          type: [string, "null"]
          format: date-time
          description: 当前窗口结束时刻；`null` 表示不会自然重置（total）。
      additionalProperties: false

    AccountRecentUsage:
      type: object
      description: 一条流水摘要。
      required: [model, created_at, charged_amount]
      properties:
        model:
          type: string
        created_at:
          type: string
          format: date-time
        charged_amount:
          type: string
          description: 本次应扣量，十进制字符串。
      additionalProperties: false

    ApiKey:
      type: object
      description: 一把 API 密钥的可见部分；哈希与明文从不出现。
      required: [id, name, key_prefix, enabled, expires_at, last_used_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        key_prefix:
          type: string
          description: 明文前缀，仅供展示与检索。
        enabled:
          type: boolean
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
      additionalProperties: false

    PageOfApiKey:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
      additionalProperties: false

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        expires_at:
          type: [string, "null"]
          format: date-time
          description: 过期时刻；`null` 或省略表示不过期。
      additionalProperties: false

    CreatedApiKey:
      type: object
      description: 创建响应；`secret` 只在此处出现一次。
      required: [id, name, key_prefix, enabled, expires_at, last_used_at, secret]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        key_prefix:
          type: string
        enabled:
          type: boolean
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        secret:
          type: string
          description: 密钥明文，仅本次响应返回，不落库、不再查询。
      additionalProperties: false

    UsageTokens:
      type: object
      description: 一次调用的 token 用量分量。子项包含于主计数：缓存读写属于输入，推理属于输出。
      required: [input_tokens, output_tokens, cache_read_tokens, cache_write_tokens,
        cache_write_5m_tokens, cache_write_1h_tokens, reasoning_tokens, server_tool_uses]
      properties:
        input_tokens:
          type: integer
          description: 输入 token 总数，含缓存读写。
        output_tokens:
          type: integer
          description: 输出 token 总数，含推理。
        cache_read_tokens:
          type: integer
        cache_write_tokens:
          type: integer
          description: 不分档的缓存写计数；与两个分档字段互斥使用。
        cache_write_5m_tokens:
          type: integer
        cache_write_1h_tokens:
          type: integer
        reasoning_tokens:
          type: integer
        server_tool_uses:
          type: integer
          description: 服务端工具执行次数，按次计费，不是 token 计数。
      additionalProperties: false

    UsageItem:
      type: object
      description: 一条用量流水。
      required: [id, model, upstream_model, protocol, cross_protocol, usage, charged_amount, created_at]
      properties:
        id:
          type: integer
          format: int64
        model:
          type: string
          description: 客户端请求的模型名。
        upstream_model:
          type: string
          description: 实际履约的模型名。
        protocol:
          type: string
          description: 客户端使用的线协议。
        cross_protocol:
          type: boolean
        usage:
          $ref: "#/components/schemas/UsageTokens"
        charged_amount:
          type: string
          description: 本次应扣量，十进制字符串。
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    PageOfUsageItem:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageItem"
      additionalProperties: false

    UsageStatsItem:
      type: object
      description: 一个分组维度的用量合计。
      required: [key, calls, usage, charged_amount]
      properties:
        key:
          type: string
          description: |
            分组值：`day` 为日期（`YYYY-MM-DD`），`model` 为客户端请求的模型名，
            `api_key` 为密钥 id 的十进制文本。
        calls:
          type: integer
          description: 区间内成功履约的请求次数，与流水明细的行数一致。
        usage:
          $ref: "#/components/schemas/UsageTokens"
        charged_amount:
          type: string
          description: 应扣量合计：逐行「基础价 × 倍率」相加，十进制字符串。
      additionalProperties: false

    PageOfUsageStatsItem:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageStatsItem"
      additionalProperties: false

    PartnerChannel:
      type: object
      description: 一条上游渠道。不含商家标识与渠道级扩展配置。
      required: [id, name, vendor, type, cred_group, base_url, priority, weight, enabled]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 渠道名，商家内用于区分同协议的多条渠道。
        vendor:
          type: string
          description: 上游厂商标签，仅供展示与对账分组，不参与路由。
        type:
          type: string
          description: 协议方言。
          enum: [openai_chat, openai_responses, anthropic_messages, gemini_generate]
        cred_group:
          type: string
          description: 凭据分组，与上游凭据的 `cred_group` 对应。
        base_url:
          type: string
          description: 上游根地址，端点段由协议决定。
        priority:
          type: integer
          description: 路由排序，值大者优先。
        weight:
          type: integer
          description: 同优先级内的加权随机权重。
        enabled:
          type: boolean
      additionalProperties: false

    PageOfPartnerChannel:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerChannel"
      additionalProperties: false

    CreatePartnerChannelRequest:
      type: object
      description: 登记渠道的请求体；归属由会话推导，不接受商家参数。
      required: [name, type, cred_group, base_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        vendor:
          type: string
          maxLength: 64
        type:
          type: string
          enum: [openai_chat, openai_responses, anthropic_messages, gemini_generate]
        cred_group:
          type: string
          minLength: 1
          maxLength: 64
        base_url:
          type: string
          minLength: 1
          maxLength: 255
          description: 上游根地址，只填到端点段之前。
        credential_style:
          type: string
          description: |
            凭据注入形态；省略按协议现状。渠道级扩展配置（静态请求头等）属平台运维口径，
            不由商家自助填写。
          enum: [authorization, x-api-key, x-goog-api-key, query]
        priority:
          type: integer
          minimum: 1
          description: 路由排序，值大者优先；省略取 100。
        weight:
          type: integer
          minimum: 1
          description: 同优先级内的加权随机权重；省略取 100。
      additionalProperties: false

    PartnerCredential:
      type: object
      description: 一份上游凭据。只有前缀，明文从不返回。
      required: [id, cred_group, name, prefix, enabled]
      properties:
        id:
          type: integer
          format: int64
        cred_group:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: 脱敏前缀，足以区分凭据行、不足以还原明文。
        enabled:
          type: boolean
      additionalProperties: false

    CreatedPartnerCredential:
      type: object
      description: 凭据的创建响应；`secret` 只在此处出现一次。
      required: [id, cred_group, name, prefix, enabled, secret]
      properties:
        id:
          type: integer
          format: int64
        cred_group:
          type: string
        name:
          type: string
        prefix:
          type: string
        enabled:
          type: boolean
        secret:
          type: string
          description: 凭据明文，仅本次响应返回；列表与后续读取只给前缀。
      additionalProperties: false

    PageOfPartnerCredential:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerCredential"
      additionalProperties: false

    CreatePartnerCredentialRequest:
      type: object
      description: 登记凭据的请求体；归属由会话推导，不接受商家参数。
      required: [cred_group, name, api_key]
      properties:
        cred_group:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 64
        api_key:
          type: string
          minLength: 1
          description: 上游凭据明文，只在写入这一条路径出现。
      additionalProperties: false

    PartnerSettlement:
      type: object
      description: |
        一个商家一个账期的分账对账单，字段与 `settlement.BillView` 一致，只去掉商家标识 ——
        它就是会话本身。金额与抽成率是十进制字符串（金额 8 位小数、抽成率 4 位），
        口径见 `docs/compatibility.md` 的「分佣与结算口径」。
      required: [period, from, to, commission_rate, trades, gross_sales, commission, upstream_cost, payout]
      properties:
        period:
          type: string
          description: 结算账期。
          enum: [day, week, month]
        from:
          type: string
          format: date-time
          description: 账期起点（含）。
        to:
          type: string
          format: date-time
          description: 账期终点（不含）。
        commission_rate:
          type: string
          description: 平台抽成率，十进制字符串，最多 4 位小数。
        trades:
          type: integer
          description: 账期内的成交笔数。
        gross_sales:
          type: string
          description: 卖出总额（本商家名下账户的实付合计），十进制字符串。
        commission:
          type: string
          description: 平台抽成（卖出总额 × 抽成率），十进制字符串。
        upstream_cost:
          type: string
          description: 上游成本（本商家名下渠道用量的牌价基础价合计），十进制字符串。
        payout:
          type: string
          description: 商家收益（卖出总额 − 平台抽成 − 上游成本），十进制字符串。
      additionalProperties: false

    ModelInfo:
      type: object
      description: 一个当前账户可调用的模型。
      required: [name, protocols]
      properties:
        name:
          type: string
          description: 客户端可用的模型名，可直接用于请求体。
        protocols:
          type: array
          description: 支持调用的线协议标识。
          items:
            type: string
      additionalProperties: false

    PageOfModelInfo:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"
      additionalProperties: false

    Product:
      type: object
      description: 一个可购买的商品档位；数量与售价都是十进制字符串。
      required: [id, name, unit, qty, price, model_scope, validity_days]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          description: 档位名称，面向用户。
        unit:
          type: string
          description: 派生存量的结算单位 `currency` / `token` / `credit`。
        qty:
          type: string
          description: 每份包含的数量，十进制字符串。
        price:
          type: string
          description: 售价，十进制字符串。
        model_scope:
          type: [array, "null"]
          description: |-
            该档位的可用模型范围；`null` 表示不限。空数组表示一个模型都不含，
            与 `null` 是两个不同的口径。
          items:
            type: string
        validity_days:
          type: integer
          minimum: 0
          description: 派生账本的有效天数；`0` 表示不过期。
      additionalProperties: false

    PageOfProduct:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      additionalProperties: false

    CreateOrderRequest:
      type: object
      description: 下单请求；账户归属由会话推导，不接受账户或商家参数。
      required: [product_id, qty, idempotency_key]
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
        qty:
          type: string
          minLength: 1
          maxLength: 32
          description: 购买份数，正数的十进制字符串。
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 64
          description: |-
            客户端生成的幂等键。同一账户下同一键的重复提交只产生一笔订单，
            响应返回首次创建的那笔订单；键在账户内唯一，不同账户可以用同一个键。
      additionalProperties: false

    Order:
      type: object
      description: 一笔订单；金额、数量与折算率都是十进制字符串，不经浮点。
      required: [id, product_id, product_name, unit, qty, price_paid, total, unit_rate, purchased_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        product_id:
          type: integer
          format: int64
          minimum: 1
        product_name:
          type: string
          description: 购买时档位的名称。
        unit:
          type: string
          description: 派生存量的结算单位 `currency` / `token` / `credit`。
        qty:
          type: string
          description: 购买份数，十进制字符串。
        price_paid:
          type: string
          description: 实付金额，十进制字符串。
        total:
          type: string
          description: 本次购买派生的存量 = 每份数量 × 份数，十进制字符串。
        unit_rate:
          type: string
          description: 购买时刻锁定的折算率 = 售价 / 每份数量，十进制字符串。
        purchased_at:
          type: string
          format: date-time
          description: 购买时刻。
      additionalProperties: false

    PageOfOrder:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
      additionalProperties: false

    RequestItem:
      type: object
      description: 一条请求记录的摘要与归属层字段。
      required: [request_id, created_at, status, http_status, upstream_status, failure_class,
        error_code, duration_ms, model, upstream_model, protocol, upstream_protocol,
        cross_protocol, api_key_id, usage, payload_available]
      properties:
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [success, failed, cancelled]
          description: 请求终态。
        http_status:
          type: integer
          description: 返回给客户端的 HTTP 状态码。
        upstream_status:
          type: [integer, "null"]
          description: 上游返回的状态码；未取得时为 `null`。
        failure_class:
          type: [string, "null"]
          description: 失败分类；成功时为 `null`。
        error_code:
          type: [string, "null"]
          description: 网关错误码；成功时为 `null`。
        duration_ms:
          type: integer
          description: 上游调用耗时，不含向客户端写出的耗时。
        model:
          type: string
          description: 客户端请求的模型名。
        upstream_model:
          type: string
          description: 实际发往上游的模型名；与 `model` 不同表示网关改写过。
        protocol:
          type: string
          description: 客户端使用的线协议。
        upstream_protocol:
          type: string
          description: 本次请求发往上游的线协议。
        cross_protocol:
          type: boolean
          description: 两侧协议是否不同，即本次是否发生跨协议重建。
        api_key_id:
          type: integer
          format: int64
          description: 签发本次调用的密钥 id，可按它过滤。
        usage:
          oneOf:
            - $ref: "#/components/schemas/UsageTokens"
            - type: "null"
          description: 取得的 token 用量；未取得时为 `null`。
        payload_available:
          type: boolean
          description: |
            是否存在可取的脱敏报文。仅失败请求保留报文，且只保留 7 天，
            其余情况为 `false`。
        stream:
          type: boolean
          description: 本次是否为流式请求。
        written_bytes:
          type: integer
          description: 已写给客户端的响应体字节数。
      additionalProperties: false

    PageOfRequestItem:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestItem"
      additionalProperties: false

    RequestStatsItem:
      type: object
      description: 一个分组维度的请求计数。
      required: [key, total, success, failed, cancelled]
      properties:
        key:
          type: string
          description: |
            分组值：`day` 为日期（`YYYY-MM-DD`），`model` 为模型名，`status` 为终态。
        total:
          type: integer
        success:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
      additionalProperties: false

    RequestStatsPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestStatsItem"
      additionalProperties: false

    RequestAttempt:
      type: object
      description: 一次上游尝试。重试、渠道回退各占一条，按尝试序号排列。
      required: [attempt, outcome, upstream_status, failure_class, error_code,
        cross_protocol, duration_ms]
      properties:
        attempt:
          type: integer
          description: 尝试序号，从 1 起。
        outcome:
          type: string
          enum: [ok, failed, cancelled, skipped]
        upstream_status:
          type: [integer, "null"]
        failure_class:
          type: [string, "null"]
        error_code:
          type: [string, "null"]
        cross_protocol:
          type: boolean
        duration_ms:
          type: integer
      additionalProperties: false

    RedactedPayload:
      type: object
      description: |
        脱敏后的报文结构。键名与嵌套层次原样保留，值按规则处理：请求参数白名单保留
        真值；用户内容替换为 `{"__redacted": "<类型>", "len": <长度>}`；数组保留
        元素形状，元素数超过采样上限时补 `__total` 给出实际数量。

        原文从不落盘，本结构可解析、可对比，用于判定请求形状与参数是否符合预期，
        但不含用户数据。
      additionalProperties: true

    RequestDetail:
      type: object
      description: 一条请求记录的完整视图。
      required: [request, attempts, request_shape, upstream_request_shape,
        error_response_shape, rewritten_parts, client_ip, user_agent]
      properties:
        request:
          $ref: "#/components/schemas/RequestItem"
        attempts:
          type: array
          description: 尝试时间线，按尝试序号排列。
          items:
            $ref: "#/components/schemas/RequestAttempt"
        request_shape:
          oneOf:
            - $ref: "#/components/schemas/RedactedPayload"
            - type: "null"
          description: 脱敏后的客户端请求结构；无报文时为 `null`。
        upstream_request_shape:
          oneOf:
            - $ref: "#/components/schemas/RedactedPayload"
            - type: "null"
          description: |
            脱敏后实际发往上游的请求结构。与 `request_shape` 的差异即网关改写的部分：
            模型名替换、协议重建、报文改写。无报文时为 `null`。
        error_response_shape:
          oneOf:
            - $ref: "#/components/schemas/RedactedPayload"
            - type: "null"
          description: 脱敏后的错误响应结构；成功请求或超期后为 `null`。
        rewritten_parts:
          type: array
          description: 网关对报文做过的改写标注，按出现顺序排列；未改写时为空数组。
          items:
            type: string
        client_ip:
          type: string
          description: |
            客户端地址。取自连接层，存在反向代理时为代理地址；客户端可影响其取值，
            只作排障线索，不作为安全判定依据。
        user_agent:
          type: string
          description: |
            客户端自报的 User-Agent，按上限截断；未自报时为空串。可伪造，
            只作排障线索。
      additionalProperties: false

    AdminChannel:
      type: object
      description: |
        一条上游渠道，字段与 `tokenmp admin channel list --json` 的行一致。
        `config` 不在其中：探针请求头里可能有鉴权 token，管理面不回显配置原文。
      required: [id, merchant_id, name, vendor, type, cred_group, base_url, priority, weight, enabled]
      properties:
        id:
          type: integer
          format: int64
        merchant_id:
          type: integer
          format: int64
          description: 归属商家 id。
        name:
          type: string
        vendor:
          type: string
          description: 厂商标识，如 `openai` / `anthropic` / `gemini`。
        type:
          type: string
          description: 渠道的线协议类型，取值见数据面的渠道类型白名单。
        cred_group:
          type: string
          description: 取用上游凭据的分组名。
        base_url:
          type: string
          description: 上游基地址。
        priority:
          type: integer
          description: 选路优先级，越小越优先。
        weight:
          type: integer
          description: 同优先级内的加权轮询权重。
        enabled:
          type: boolean
      additionalProperties: false

    PageOfAdminChannel:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminChannel"
      additionalProperties: false

    AdminCredential:
      type: object
      description: |
        一行上游凭据，字段与 `tokenmp admin credential list --json` 的行一致。
        明文与 secret JSON 从不出现，只有脱敏前缀。
      required: [id, merchant_id, cred_group, name, kind, prefix, expired, enabled]
      properties:
        id:
          type: integer
          format: int64
        merchant_id:
          type: integer
          format: int64
        cred_group:
          type: string
          description: 凭据分组；渠道按它取用凭据。
        name:
          type: string
          description: 凭据名，用于同组内区分轮换。
        kind:
          type: string
          description: "凭据形态：`api`、`oauth`，解析失败时为 `unknown`。"
        prefix:
          type: string
          description: 可展示的明文前缀。
        expires:
          type: string
          description: oauth 凭据的过期时刻（RFC3339）；api 凭据没有该字段。
        expired:
          type: boolean
          description: oauth 凭据的访问令牌是否已过期；api 凭据恒为 false。
        enabled:
          type: boolean
      additionalProperties: false

    PageOfAdminCredential:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminCredential"
      additionalProperties: false

    AdminModelMap:
      type: object
      description: 一条渠道模型映射，字段与 `tokenmp admin model-map list --json` 的行一致。
      required: [id, channel_id, model, upstream_model, price_multiplier, enabled]
      properties:
        id:
          type: integer
          format: int64
        channel_id:
          type: integer
          format: int64
        model:
          type: string
          description: 客户端请求的模型名。
        upstream_model:
          type: string
          description: 转发给该渠道时替换成的模型名。
        price_multiplier:
          type: string
          description: 该映射的价格倍率，十进制字符串。
        request_overrides:
          type: object
          additionalProperties: true
          description: 转发时叠加到请求体上的字段；未配置时该字段不出现。
        enabled:
          type: boolean
      additionalProperties: false

    PageOfAdminModelMap:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminModelMap"
      additionalProperties: false

    AdminMerchant:
      type: object
      description: 一个商家，字段与 `tokenmp admin merchant list --json` 的行一致。
      required: [id, code, name, kind, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          description: 商家编码，平台内唯一。
        name:
          type: string
        kind:
          type: string
          description: 商家类型：`platform` 平台自营，`partner` 入驻商家。
          enum: [platform, partner]
        status:
          type: string
          description: 商家状态：`active` / `disabled`。
        owner_user_id:
          type: [integer, "null"]
          format: int64
          description: 绑定的登录主体 id；未绑定时为 `null`（平台自营或尚未绑定）。
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    PageOfAdminMerchant:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminMerchant"
      additionalProperties: false

    CreateAdminMerchantRequest:
      type: object
      description: 新建商家的请求体。
      required: [code, name, kind]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: 商家编码，平台内唯一；重复返 `code=409`。
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum: [platform, partner]
      additionalProperties: false

    SetAdminMerchantOwnerRequest:
      type: object
      description: 绑定商家归属的请求体。
      required: [user_id]
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
          description: 登录主体 id；归属一对一，已被其它商家占用时返 `code=409`。
      additionalProperties: false

    CreateAdminChannelRequest:
      type: object
      description: 新建渠道的请求体。
      required: [merchant_id, name, type, cred_group, base_url]
      properties:
        merchant_id:
          type: integer
          format: int64
          minimum: 1
          description: 归属商家 id，取自商家清单。
        name:
          type: string
          minLength: 1
          maxLength: 64
        vendor:
          type: string
          maxLength: 64
          description: 厂商标识，如 `openai` / `anthropic` / `gemini`；仅供展示与对账分组。
        type:
          type: string
          description: 渠道的线协议类型。
          enum: [openai_chat, openai_responses, anthropic_messages, gemini_generate]
        cred_group:
          type: string
          minLength: 1
          maxLength: 64
          description: 凭据分组名；本端点只建立分组名，凭据另行写入。
        base_url:
          type: string
          minLength: 1
          maxLength: 255
          description: 上游基地址，只填到端点段之前。
        credential_style:
          type: string
          description: 凭据注入形态；省略时按协议现状注入。
          enum: [authorization, x-api-key, x-goog-api-key, query]
        config:
          type: object
          additionalProperties: true
          description: |
            渠道级扩展配置原文：`headers` 是静态请求头（字符串到字符串的对象，不得占用
            网关自身的头名），其余键供探针声明。省略时无扩展配置。
        priority:
          type: integer
          minimum: 1
          description: 选路优先级，值小者优先；省略取 100。
        weight:
          type: integer
          minimum: 1
          description: 同优先级内的加权轮询权重；省略取 100。
      additionalProperties: false

    CreateAdminCredentialRequest:
      type: object
      description: 写入上游凭据的请求体。
      required: [merchant_id, cred_group, name, api_key]
      properties:
        merchant_id:
          type: integer
          format: int64
          minimum: 1
          description: 归属商家 id。
        cred_group:
          type: string
          minLength: 1
          maxLength: 64
          description: 凭据分组，与渠道的 `cred_group` 对应。
        name:
          type: string
          minLength: 1
          maxLength: 64
        api_key:
          type: string
          minLength: 1
          description: 上游凭据明文，只在写入这一条路径出现；响应不回显。
      additionalProperties: false

    SetAdminModelMapRequest:
      type: object
      description: 写入渠道模型映射的请求体；按 `(channel_id, model)` 幂等。
      required: [channel_id, model, upstream_model]
      properties:
        channel_id:
          type: integer
          format: int64
          minimum: 1
        model:
          type: string
          minLength: 1
          maxLength: 128
          description: 客户端请求的模型名。
        upstream_model:
          type: string
          minLength: 1
          maxLength: 128
          description: 转发给该渠道时替换成的模型名。
        price_multiplier:
          type: string
          description: 该映射的价格倍率，十进制字符串；省略取 1。
        request_overrides:
          type: object
          additionalProperties: true
          description: 转发时叠加到请求体上的字段；省略时不叠加。
      additionalProperties: false

    AdminResourceID:
      type: object
      description: 写入动作的结果：受影响行的主键。
      required: [id]
      properties:
        id:
          type: integer
          format: int64
      additionalProperties: false

    AdminAccount:
      type: object
      description: 一个账户，字段与 `tokenmp admin account list --json` 的行一致。
      required: [id, code, name, owner_user_id, default_merchant_id, price_multiplier, status]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        owner_user_id:
          type: [integer, "null"]
          description: 归属登录主体的 id；平台账户没有归属时为 `null`。
        default_merchant_id:
          type: [integer, "null"]
          description: 默认商家 id；未指定时为 `null`。
        price_multiplier:
          type: string
          description: 账户级价格倍率，十进制字符串。
        status:
          type: string
          description: "账户状态：`active` 可用，`disabled` 已停用。"
      additionalProperties: false

    PageOfAdminAccount:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccount"
      additionalProperties: false

    AdminPricing:
      type: object
      description: |
        一个定价版本，字段与 `tokenmp admin price list --json` 的行一致。
        改价产生新版本行并把旧版本 `retired_at` 置位，不覆盖旧行。
      required: [id, merchant_id, model, version, effective_at, retired_at]
      properties:
        id:
          type: integer
          format: int64
        merchant_id:
          type: integer
          format: int64
          description: 定价归属的商家 id。
        model:
          type: string
          description: 客户端请求的模型名。
        version:
          type: integer
          description: 同一 (商家, 模型) 下自增的版本号。
        effective_at:
          type: string
          format: date-time
          description: 版本生效时刻。
        retired_at:
          type: [string, "null"]
          format: date-time
          description: 版本退役时刻；`null` 表示当前生效。
      additionalProperties: false

    PageOfAdminPricing:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPricing"
      additionalProperties: false

    AdminQuota:
      type: object
      description: |
        一条窗口限额定义加当前窗口的已用量，字段与 `tokenmp admin quota list --json`
        的行一致。已用量与剩余额度由判定链上的同一份窗口计算得出。
      required: [id, scope, scope_id, metric, window_kind, period, limit_amount, action, used, remaining]
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
          description: "限额作用范围：`account` / `api_key` / `channel` / `plan`。"
        scope_id:
          type: integer
          format: int64
          description: 范围实体的 id。
        metric:
          type: string
          description: 计量指标，取值见数据面的计费指标白名单。
        window_kind:
          type: string
          description: 窗口类型。
        period:
          type: string
          description: 窗口周期。
        limit_amount:
          type: string
          description: 窗口内允许的额度上限，十进制字符串。
        action:
          type: string
          description: 超限时的处置动作。
        used:
          type: [string, "null"]
          description: 当前窗口已用量，十进制字符串；无法判定时为 `null`。
        remaining:
          type: [string, "null"]
          description: 当前窗口剩余额度，十进制字符串；无法判定时为 `null`。
      additionalProperties: false

    PageOfAdminQuota:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuota"
      additionalProperties: false

    AdminAdjustment:
      type: object
      description: 一条人工调账记录，字段与 `tokenmp admin adjust list --json` 的行一致。
      required: [id, account_id, delta_amount, reason, operator, created_at]
      properties:
        id:
          type: integer
          format: int64
        account_id:
          type: integer
          format: int64
        delta_amount:
          type: string
          description: 调整数量，十进制字符串；正数为补扣，负数为退费。
        reason:
          type: string
        operator:
          type: string
          description: 操作者标识。
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    PageOfAdminAdjustment:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAdjustment"
      additionalProperties: false

    AdminUsageItem:
      type: object
      description: |
        一条跨账户的用量流水，字段与 `tokenmp admin usage list --json` 的行一致。
        流水是 append-only 的计费事实，一次请求一行。
      required: [id, merchant_id, account_id, channel_id, model, usage, gross_amount, multiplier, created_at]
      properties:
        id:
          type: integer
          format: int64
        merchant_id:
          type: integer
          format: int64
          description: 结算归属的商家 id。
        account_id:
          type: integer
          format: int64
        channel_id:
          type: integer
          format: int64
          description: 实际履约的渠道 id。
        model:
          type: string
        usage:
          type: object
          additionalProperties:
            type: string
          description: 本次调用的用量分量，键为计费指标、值为十进制字符串。
        gross_amount:
          type: string
          description: 结算前的应扣量，十进制字符串。
        multiplier:
          type: string
          description: 本次生效的总倍率，十进制字符串。
        settlement:
          type: object
          additionalProperties: true
          description: 结算明细；未结算时该字段不出现。
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    PageOfAdminUsageItem:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUsageItem"
      additionalProperties: false

    AdminSettlementItem:
      type: object
      description: |
        一个商家的结算对账单，字段与 `tokenmp admin settlement list --json` 的行一致；
        比 PartnerSettlement 多 `merchant_id`：管理面是跨商家的清单，没有它分行无从归属。
      required: [merchant_id, period, from, to, commission_rate, trades, gross_sales, commission, upstream_cost, payout]
      properties:
        merchant_id:
          type: integer
          format: int64
          description: 结算归属的商家 id。
        period:
          type: string
          description: 结算账期。
          enum: [day, week, month]
        from:
          type: string
          format: date-time
          description: 账期起点（含）。
        to:
          type: string
          format: date-time
          description: 账期终点（不含）。
        commission_rate:
          type: string
          description: 平台抽成率，十进制字符串，最多 4 位小数。
        trades:
          type: integer
          description: 账期内的成交笔数。
        gross_sales:
          type: string
          description: 卖出总额，十进制字符串。
        commission:
          type: string
          description: 平台抽成，十进制字符串。
        upstream_cost:
          type: string
          description: 上游成本，十进制字符串。
        payout:
          type: string
          description: 商家收益，十进制字符串。
      additionalProperties: false

    PageOfAdminSettlementItem:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminSettlementItem"
      additionalProperties: false

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 起；缺省 1。
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数；缺省 20，上限 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Since:
      name: since
      in: query
      required: false
      description: 起始时刻（含），RFC3339；缺省不限。
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      required: false
      description: 结束时刻（含），RFC3339；缺省不限。
      schema:
        type: string
        format: date-time
    WindowFrom:
      name: from
      in: query
      required: false
      description: |-
        账期起点（含），RFC3339。与 `to` 一起给出即按该区间出账；都不给时按商家的账期
        取上一个完整自然周期。只给一侧返回 `code=400`。
      schema:
        type: string
        format: date-time
    WindowTo:
      name: to
      in: query
      required: false
      description: 账期终点（不含），RFC3339。与 `from` 一起给出。
      schema:
        type: string
        format: date-time
    ModelFilter:
      name: model
      in: query
      required: false
      description: 按模型名精确匹配；缺省不过滤。
      schema:
        type: string
    ApiKeyFilter:
      name: api_key_id
      in: query
      required: false
      description: 按签发本次调用的密钥 id 过滤；缺省不过滤。
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminMerchantFilter:
      name: merchant_id
      in: query
      required: false
      description: 按商家 id 过滤；缺省不过滤。
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminAccountFilter:
      name: account_id
      in: query
      required: false
      description: 按账户 id 过滤；缺省不过滤。管理面独有：用户面的作用域一律由会话推导。
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminScopeFilter:
      name: scope
      in: query
      required: false
      description: |
        按限额 / 规则的作用范围过滤，取值 `account` / `api_key` / `channel` / `plan`；
        与 `scope_id` 必须成对给出，缺省列出全部。
      schema:
        type: string
        enum: [account, api_key, channel, plan]
    AdminScopeIDFilter:
      name: scope_id
      in: query
      required: false
      description: 范围实体的 id，与 `scope` 成对使用。
      schema:
        type: integer
        format: int64
        minimum: 1

    ResourceID:
      name: id
      in: path
      required: true
      description: 资源主键；不属于本商家的取值一律按不存在处理。
      schema:
        type: integer
        format: int64
        minimum: 1

    AdminResourceID:
      name: id
      in: path
      required: true
      description: |
        管理面对象主键。动作按主键置位，不区分行是否存在：不存在的 id 不报错，也不影响
        任何行。
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: 参数缺失或非法，`code=400`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Unauthorized:
      description: 未登录、会话失效或凭据错误，`code=401`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    PaymentRequired:
      description: |-
        账户无可用额度，`code=402`。与数据面同一判定（`settlement.Fundable`）：
        没有任何未过期且可扣的账本，也不存在可透支的货币账本。
        页面据此给出充值 / 购买引导（web/AGENTS.md 的三态）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    ChallengeExpired:
      description: 一次性加密公钥已失效，`code=410`；重新获取公钥后重试一次。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    TooManyRequests:
      description: 触发频率限制，`code=429`。
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Forbidden:
      description: 已登录但无权访问该资源，`code=403`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    NotFound:
      description: 资源不存在或不属于当前账户，`code=404`；两者不作区分，避免探测他人资源。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Conflict:
      description: 状态冲突，`code=409`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    InternalError:
      description: 服务端错误，`code=500`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
