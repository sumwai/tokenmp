openapi: 3.1.0

# TokenMP Web 页面通信契约。
#
# 职责：浏览器前端页面与服务端之间的全部通信。页面调用的端点只允许出现在本文件；
# 数据面（模型转发与账户自助查询）在 docs/openapi.yaml，两者不混写。
#
# 单一事实源：接口路径、请求/响应字段、状态码与业务码以本文件为准。前端的响应类型与
# 客户端一律由本文件生成，禁止手写；实现变更必须在同一 PR 内同步本文件。
#
# 路径段用单词，不使用连字符复合词（signin / signup / signout / challenge / otp）。
#
# 信封：所有端点共用 {code, data, message, page, size, total} 六字段信封。
# 字段名统一 snake_case，与仓库既有 JSON 序列化风格一致。
info:
  title: TokenMP Web 页面通信
  version: "0"
  description: |
    页面通信与数据面的分界：

    - 本文件（`/api/v1/*`）：浏览器页面调用的会话、账户、业务数据端点；
    - `docs/openapi.yaml`（`/v1/*`、`/v1beta/*`、`/healthz`）：模型转发与账户自助查询，
      由模型客户端与集成调用，页面不直接调用。

    信封语义：

    - `code` 业务结果码，程序按它分支：`200` 成功，其余为失败；
      HTTP 状态码表达传输层结果，两者在成功时一致，失败时以 `code` 为准；
      `message` 面向用户的文案，程序不得按它分支。
    - `data` 业务数据，结构由各端点声明；无数据时省略或 `null`。
    - `page` / `size` / `total` 分页信息，仅列表端点填充，其余端点为 `null`。
      `page` 从 1 起，`size` 为每页条数，`total` 为总条数。

    业务码取值：

    | code | 含义 |
    |---|---|
    | 200 | 成功 |
    | 400 | 参数缺失或非法 |
    | 401 | 未登录、会话失效或凭据错误 |
    | 403 | 已登录但无权访问 |
    | 404 | 资源不存在或登录方式未启用 |
    | 409 | 状态冲突（邮箱已注册等） |
    | 410 | 一次性加密公钥失效，重新获取后重试 |
    | 429 | 触发频率限制 |
    | 500 | 服务端错误 |

    密码不传明文，流程按客户端指纹串起：

    1. 客户端持有本地生成的 `fingerprint`（在本地持久化，随每次请求带回）；
    2. 调 `GET /api/v1/auth/challenge?fingerprint=…` 换取一次性公钥，
       服务端以该指纹为索引保存私钥，同一指纹再次获取会覆盖旧值；
    3. 用 RSA-OAEP（SHA-256）加密密码，提交密文与同一 `fingerprint`；
    4. 私钥取出即失效，密钥过期或已用返回 `code=410`，客户端重新执行 2-3 后重试一次。

    登录方式：账号密码（signin / signup）与第三方 OAuth（Google、GitHub 等，
    经 `providers` 列出、`oauth` 跳转、`exchange` 换取会话）。注销账号（erase）
    与重置密码（reset）各自需要对应用途的 OTP。

    路径分区：

    - `/api/v1/auth/*`：认证面，注册、登录、会话、密码与第三方登录。
    - `/api/v1/user/*`：用户级业务数据。作用域由会话推导，不接受账户 id 参数；
      一个登录主体拥有一个账户（`account.owner_user_id`），密钥、用量与请求记录
      都挂在该账户上。列表端点用偏移分页，分页信息在信封的 `page` / `size` / `total`。
    - `/api/v1/merchant/*`、`/api/v1/admin/*`：商家面与管理面，尚未定义。
servers:
  - url: http://localhost:8080
    description: 默认监听地址来自 `TOKENMP_LISTEN`，未配置时为 `:8080`。

tags:
  - name: auth
    description: 注册、登录、会话与密码管理
  - name: oauth
    description: 第三方登录
  - name: user
    description: 用户级业务数据：账户概览、密钥、用量、请求记录与模型目录

# 默认端点需要会话令牌；公开端点逐个置空。
security:
  - webSession: []

paths:
  /api/v1/auth/challenge:
    get:
      tags: [auth]
      summary: 获取一次性密码加密公钥
      description: |
        注册、登录与改密前调用。以 `fingerprint` 为索引生成一对一次性密钥，
        同一指纹重复获取会覆盖旧密钥；私钥取出即失效。同一来源受频率限制，
        超限返回 `code=429`。
      operationId: getAuthChallenge
      security: []
      parameters:
        - name: fingerprint
          in: query
          required: true
          description: 客户端本地持久化的指纹，作为一次性密钥的索引。
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        "200":
          description: 公钥获取成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChallengeData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/signin:
    post:
      tags: [auth]
      summary: 登录
      description: |
        校验账号与密码并签发会话。密码必须是经 `challenge` 公钥加密后的 base64 密文，
        且 `fingerprint` 与取公钥时一致。账号不存在、密码错误、账号停用一律返回
        `code=401` 且文案一致，不区分失败原因；`code=410` 表示密钥已失效，
        重新取公钥后重试一次。
      operationId: signin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninRequest"
      responses:
        "200":
          description: 登录成功，签发会话令牌。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/ChallengeExpired"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/signup:
    post:
      tags: [auth]
      summary: 注册
      description: |
        创建账号并在同一事务内开户，随后签发会话。密码经 `challenge` 公钥加密；
        邮箱已存在返回 `code=409`。是否开放注册由服务端配置决定，
        关闭时返回 `code=403`。
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: 注册成功，签发会话令牌。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 注册入口已关闭，`code=403`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: 邮箱或用户名已被使用，`code=409`，两者不作区分。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "410":
          $ref: "#/components/responses/ChallengeExpired"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新会话令牌
      description: 用刷新令牌换发新的访问令牌；刷新令牌一次性轮换，旧值同时作废。
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 换发成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AccessTokenData"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/session:
    get:
      tags: [auth]
      summary: 查询当前会话身份
      description: |
        返回当前登录身份、角色与已绑定的第三方登录方式，前端据此渲染导航清单与首页段落；
        角色与权限的真相在服务端，前端不硬编码角色取值。
      operationId: getAuthSession
      responses:
        "200":
          description: 会话有效。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/signout:
    post:
      tags: [auth]
      summary: 登出
      description: 吊销当前会话令牌；重复调用同样返回成功。
      operationId: signout
      responses:
        "200":
          description: 登出成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/otp:
    post:
      tags: [auth]
      summary: 发送一次性验证码
      description: |
        向账号绑定邮箱发送一次性验证码（OTP），`purpose` 区分用途：
        `reset` 用于重置密码，`erase` 用于注销账号。无论邮箱是否存在都返回成功，
        避免通过响应差异枚举账号；同一来源受频率限制。
      operationId: sendAuthOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: 已受理（邮箱不存在时不发信但同样返回成功）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/erase:
    post:
      tags: [auth]
      summary: 注销账号
      description: |
        注销当前登录账号。提交经 `purpose=erase` 获取的 OTP 验证身份；
        成功后该账号立即不可登录，全部会话与刷新令牌失效，重复调用返回 `code=401`。
        账号标识与关联数据的保留策略由部署方配置决定。
      operationId: eraseAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EraseRequest"
      responses:
        "200":
          description: 注销成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/reset:
    post:
      tags: [auth]
      summary: 重置密码
      description: |
        校验邮箱与 OTP 后设置新密码，新密码经 `challenge` 公钥加密。
        成功后该账号的全部会话与刷新令牌失效，需重新登录。
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetRequest"
      responses:
        "200":
          description: 重置成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/ChallengeExpired"

  /api/v1/auth/password:
    put:
      tags: [auth]
      summary: 修改密码
      description: |
        已登录下调用，校验当前密码后设置新密码。当前密码与新密码各经一次
        `challenge` 取公钥加密，分别携带对应的 `fingerprint`。
        成功后除当前会话外的全部会话失效。
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: 修改成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/ChallengeExpired"

  /api/v1/auth/providers:
    get:
      tags: [oauth]
      summary: 列出可用登录方式
      description: 返回启用中的第三方登录提供方，前端据此渲染登录页的第三方入口。
      operationId: listAuthProviders
      security: []
      responses:
        "200":
          description: 登录方式列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/AuthProvider"

  /api/v1/auth/oauth/{provider}:
    get:
      tags: [oauth]
      summary: 获取第三方授权跳转地址
      description: |
        返回提供方的授权页地址（含服务端签发的 `state`），客户端整页跳转；
        `state` 在换取会话时原样带回并由服务端校验。提供方未启用返回 `code=404`。
      operationId: getAuthOauthUrl
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: 提供方标识，取值来自 `providers` 端点（如 `google`、`github`）。
          schema:
            type: string
      responses:
        "200":
          description: 授权地址。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [authorize_url, state]
                        properties:
                          authorize_url:
                            type: string
                            format: uri
                          state:
                            type: string
                        additionalProperties: false
        "404":
          description: 提供方不存在或未启用，`code=404`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/v1/auth/oauth/{provider}/exchange:
    post:
      tags: [oauth]
      summary: 用第三方授权码换取会话
      description: |
        回调落在前端路由后，客户端把提供方返回的 `code` 与 `state` 提交到本端点；
        服务端校验 `state`、向提供方换 token、按邮箱匹配或创建账号并在同一事务内开户，
        随后签发会话。提供方未启用返回 `code=404`，`state` 不匹配返回 `code=400`。
      operationId: exchangeAuthOauth
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code:
                  type: string
                  description: 提供方回调带到前端的授权码。
                state:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: 换取成功，签发会话令牌。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: 提供方不存在或未启用，`code=404`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ------------------------------------------------------------------
  # 用户级业务数据：作用域由会话推导，路径不接受账户 id。
  # ------------------------------------------------------------------
  /api/v1/user/console:
    get:
      tags: [user]
      summary: 控制台清单
      description: |
        返回当前登录主体可用的控制台清单：底部导航项、首页段落与能力集合。
        角色与权限的真相在服务端：清单按角色生成，只包含当前主体确实持有的条目
        （条目所需的能力不在 `capabilities` 里时该条目不出现），前端按清单渲染，
        不硬编码角色取值。

        `capabilities` 的取值：`console` 控制台首页、`keys` 密钥自助管理、
        `requests` 请求记录、`usage` 用量与应扣量、`account` 账户概览、
        `ops` 管理面。取值只增不改语义，未识别的取值前端忽略。
      operationId: getUserConsole
      responses:
        "200":
          description: 控制台清单。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ConsoleData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/account:
    get:
      tags: [user]
      summary: 账户概览
      description: |
        返回当前登录主体所属账户的摘要：账户标识、可用包存量、生效中的窗口限额与最近流水。
        与数据面的账户自助查询（`docs/openapi.yaml` 的 `/v1/me/account`）口径一致，
        差别只在鉴权与作用域推导；判定复用同一份实现，展示与判定不会漂移。
        响应不含密钥、上游凭据或商家内部标识。
      operationId: getUserAccount
      parameters:
        - name: recent
          in: query
          required: false
          description: 最近流水条数；缺省 10，超过 100 截到 100，`0` 表示不返回流水。
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 10
      responses:
        "200":
          description: 账户摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AccountSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/keys:
    get:
      tags: [user]
      summary: 密钥列表
      description: |
        列出当前账户下的 API 密钥，按主键倒序。只返回密钥前缀，哈希与明文从不返回。
      operationId: listUserKeys
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: enabled
          in: query
          required: false
          description: 按启用状态过滤；缺省不过滤。
          schema:
            type: boolean
      responses:
        "200":
          description: 密钥列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [user]
      summary: 创建密钥
      description: |
        为当前账户签发一把 API 密钥。明文只在本次响应出现一次，之后任何端点都不再返回；
        列表只给出前缀。密钥归属固定为当前账户，不接受归属参数。
      operationId: createUserKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "200":
          description: 创建成功，响应携带一次性明文。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/keys/{id}/revoke:
    post:
      tags: [user]
      summary: 吊销密钥
      description: |
        吊销一把属于当前账户的密钥；已吊销的密钥再次吊销同样返回成功。
        不属于当前账户的密钥返回 `code=404`，不以 403 区分存在性。
      operationId: revokeUserKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: 吊销成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/usage:
    get:
      tags: [user]
      summary: 用量流水
      description: |
        列出当前账户的用量流水，按写入时刻倒序。流水是 append-only 的计费事实，
        一次请求一行；被重试过的失败尝试不产生流水。
      operationId: listUserUsage
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/ApiKeyFilter"
      responses:
        "200":
          description: 用量流水。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfUsageItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/usage/stats:
    get:
      tags: [user]
      summary: 用量聚合
      description: |
        按维度把区间内的用量与应扣量合计起来，用于回答趋势与「花在哪了」。

        分组维度 `day` 取日期（`YYYY-MM-DD`，按写入时刻所在的自然日）、`model` 取客户端
        请求的模型名、`api_key` 取密钥 id 的十进制文本。合计与流水明细同源：同一组过滤
        参数下，明细逐行相加应等于本端点的合计。

        它只回答合计，不返回单条流水；看某次调用的明细走用量流水端点。
      operationId: getUserUsageStats
      parameters:
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: group_by
          in: query
          required: false
          description: 分组维度；缺省 `day`。
          schema:
            type: string
            enum: [day, model, api_key]
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/ApiKeyFilter"
      responses:
        "200":
          description: 聚合合计，按 `key` 升序。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfUsageStatsItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/models:
    get:
      tags: [user]
      summary: 可用模型
      description: |
        列出当前账户可调用的模型及其支持的线协议。模型可用性由渠道与模型映射决定，
        响应只给出客户端可用的模型名，不含上游模型名与渠道标识。
      operationId: listUserModels
      responses:
        "200":
          description: 模型列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfModelInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/requests:
    get:
      tags: [user]
      summary: 请求记录
      description: |
        列出当前账户的请求记录，按请求时刻倒序。粒度是客户端发起的一次请求：
        重试过的失败尝试不单独成行，因此条数与实际调用次数一致。

        记录只覆盖摘要层与归属层字段。渠道标识、上游标识、商家标识与上游错误详情
        不对用户暴露；这些字段属于商家面与管理面的统计口径。
      operationId: listUserRequests
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/ApiKeyFilter"
        - name: status
          in: query
          required: false
          description: 按终态过滤；缺省不过滤。
          schema:
            type: string
            enum: [success, failed, cancelled]
        - name: request_id
          in: query
          required: false
          description: 按请求标识精确匹配，用于定位单条记录。
          schema:
            type: string
      responses:
        "200":
          description: 请求记录。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfRequestItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/requests/{request_id}:
    get:
      tags: [user]
      summary: 请求详情
      description: |
        按请求标识返回单条记录的完整视图：摘要与归属层字段、尝试时间线，以及脱敏后的
        请求结构与错误响应结构。

        报文按「落盘即脱敏」处理：原文从不落盘，只有键名、嵌套结构与参数真值被保留，
        用户内容替换为带长度的类型标记。因此报文可解析、可对比，但不含用户数据。

        成功请求不保留报文，`request_shape` 与 `error_response_shape` 为 `null`；
        报文只保留 7 天，超期后同样为 `null`。这两点由 `payload_available` 显式区分：
        为 `false` 表示本次没有可取的报文，而不是接口异常。
      operationId: getUserRequest
      parameters:
        - name: request_id
          in: path
          required: true
          description: 请求标识，取自列表端点。
          schema:
            type: string
      responses:
        "200":
          description: 请求详情。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/requests/stats:
    get:
      tags: [user]
      summary: 请求记录聚合
      description: |
        按维度聚合当前账户的请求计数，用于回答时间跨度上的趋势与错误率。

        明细超过保留期后进入归档，本端点的数据源是随明细同步维护的按天聚合缓存，
        因此超期区间同样可查，不触发回源归档；区间内明细尚在热表时，两者口径一致。

        它只回答计数，不返回单条记录；按 `request_id` 定位具体请求走详情端点。
      operationId: getUserRequestStats
      parameters:
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: group_by
          in: query
          required: false
          description: 分组维度；缺省 `day`。
          schema:
            type: string
            enum: [day, model, status]
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/ApiKeyFilter"
      responses:
        "200":
          description: 聚合计数，按 `key` 升序。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RequestStatsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    webSession:
      type: http
      scheme: bearer
      description: |
        会话访问令牌，登录响应的 `data.access_token` 取得，随 `Authorization: Bearer` 提交。
        与数据面的模型 API 密钥是两套独立凭据，不得互换。

  headers:
    # 页面侧的退避提示；与数据面的同名头（docs/openapi.yaml 的 RetryAfter）同一套语义。
    RetryAfter:
      description: |
        触发频率限制（`code=429`）时出现，单位秒：按来源的滑动窗口推算出的最短等待时长。
        页面按它显示等待时间，不做自动重试（web/AGENTS.md 的三态）。
      schema:
        type: integer
        minimum: 1

  schemas:
    BusinessCode:
      type: integer
      description: |-
        业务结果码，取值见 info.description 的业务码表；程序按它分支，不解析 message。
        取值与常量名同时是前端业务码常量的生成来源。
      enum: [200, 400, 401, 403, 404, 409, 410, 429, 500]
      x-enum-varnames:
        [OK, BadRequest, Unauthorized, Forbidden, NotFound, Conflict, ChallengeExpired, TooManyRequests, InternalError]

    Envelope:
      type: object
      description: 页面通信的统一信封，六个字段固定出现。
      required: [code, data, message, page, size, total]
      properties:
        code:
          $ref: "#/components/schemas/BusinessCode"
        data:
          description: 业务数据，结构由各端点声明；无数据时省略或为 null。
        message:
          type: string
          description: 面向用户的文案；程序不得按它分支。
        page:
          type: [integer, "null"]
          description: 当前页码，从 1 起；非列表端点为 null。
        size:
          type: [integer, "null"]
          description: 每页条数；非列表端点为 null。
        total:
          type: [integer, "null"]
          description: 总条数；非列表端点为 null。

    EncryptedSecret:
      type: string
      description: 经一次性公钥 RSA-OAEP（SHA-256）加密后的 base64 密文。
      contentEncoding: base64

    Fingerprint:
      type: string
      minLength: 8
      maxLength: 128
      description: |
        客户端本地生成并持久化的指纹，同时充当一次性密钥的标识：
        取公钥时提交它作为索引，提交密文时携带同一值供服务端定位私钥。

    ChallengeData:
      type: object
      required: [algorithm, hash, public_key, expires_in]
      properties:
        algorithm:
          type: string
          const: RSA-OAEP
        hash:
          type: string
          const: SHA-256
        public_key:
          type: string
          description: SPKI DER 格式的 base64 公钥。
        expires_in:
          type: integer
          description: 密钥有效期，单位秒。
      additionalProperties: false

    SigninRequest:
      type: object
      required: [username, password, fingerprint]
      properties:
        username:
          type: string
          description: 账号标识（邮箱或手机号）。
        password:
          $ref: "#/components/schemas/EncryptedSecret"
        fingerprint:
          $ref: "#/components/schemas/Fingerprint"
      additionalProperties: false

    SignupRequest:
      type: object
      required: [email, username, password, fingerprint]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 2
          maxLength: 64
        password:
          $ref: "#/components/schemas/EncryptedSecret"
        fingerprint:
          $ref: "#/components/schemas/Fingerprint"
      additionalProperties: false

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
      additionalProperties: false

    SessionTokens:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: 访问令牌，随 Authorization 头提交。
        refresh_token:
          type: string
          description: 刷新令牌，一次性轮换。
        expires_in:
          type: integer
          description: 访问令牌有效期，单位秒。
        user:
          $ref: "#/components/schemas/SessionUser"
      additionalProperties: false

    AccessTokenData:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: 访问令牌有效期，单位秒。
      additionalProperties: false

    SessionUser:
      type: object
      required: [id, username, role, identities]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [member, partner, admin]
          description: |
            角色标识：`member` 调用方（注册默认）、`partner` 商户、`admin` 平台管理员。
            三者都是用户，都拥有自己的账户，都能签发密钥并调用模型；角色只决定控制台与
            管理能力范围。取值由服务端下发，前端按值渲染导航与权限，不硬编码。
        identities:
          type: array
          description: 已绑定的登录身份，`password` 表示已设密码，其余为第三方提供方标识。
          items:
            type: string
      additionalProperties: false

    AuthProvider:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: 提供方标识，用于 `oauth` 与 `exchange` 端点的 `provider` 参数。
        name:
          type: string
          description: 展示名。
      additionalProperties: false

    SendOtpRequest:
      type: object
      required: [email, purpose]
      properties:
        email:
          type: string
          format: email
        purpose:
          type: string
          enum: [reset, erase]
          description: 验证码用途：`reset` 重置密码，`erase` 注销账号；两者不可混用。
      additionalProperties: false

    EraseRequest:
      type: object
      required: [otp]
      properties:
        otp:
          type: string
          description: 经 `purpose=erase` 获取的一次性验证码。
      additionalProperties: false

    ResetRequest:
      type: object
      required: [email, otp, password, fingerprint]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          description: 经 `purpose=reset` 获取的一次性验证码。
        password:
          $ref: "#/components/schemas/EncryptedSecret"
        fingerprint:
          $ref: "#/components/schemas/Fingerprint"
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      required: [current_password, current_fingerprint, new_password, new_fingerprint]
      properties:
        current_password:
          $ref: "#/components/schemas/EncryptedSecret"
        current_fingerprint:
          $ref: "#/components/schemas/Fingerprint"
        new_password:
          $ref: "#/components/schemas/EncryptedSecret"
        new_fingerprint:
          $ref: "#/components/schemas/Fingerprint"
      additionalProperties: false

    # ------------------------------------------------------------------
    # 用户级业务数据
    # ------------------------------------------------------------------
    ConsoleData:
      type: object
      description: 控制台清单：当前主体的导航项、首页段落与能力集合。
      required: [role, capabilities, navigation, sections]
      properties:
        role:
          type: string
          description: |
            当前主体角色，与 `SessionUser.role` 同取值域。它只用于展示与排障：
            前端按 `capabilities` 与清单条目渲染，不按角色取值分支。
        capabilities:
          type: array
          description: 当前主体持有的能力标识；取值只增不改语义，未识别的取值一律忽略。
          items:
            type: string
        navigation:
          type: array
          description: 底部导航项，按顺序渲染；数量不超过 5。
          items:
            $ref: "#/components/schemas/ConsoleEntry"
        sections:
          type: array
          description: 首页段落，按顺序渲染；条目被过滤光的段落不出现。
          items:
            $ref: "#/components/schemas/ConsoleSection"
      additionalProperties: false

    ConsoleEntry:
      type: object
      description: 一条控制台条目，即一个页面入口。
      required: [title, description, icon, path, capability]
      properties:
        title:
          type: string
        description:
          type: string
          description: 一句话说明；无补充说明时为空串。
        icon:
          type: string
          description: Lucide 图标名（kebab-case）；未登记的名字不渲染图标。
        path:
          type: string
          description: 站内相对路径，用于导航与登录回跳。
        capability:
          type: string
          description: 该条目所需的能力标识；不在 `capabilities` 里时不渲染本项。
      additionalProperties: false

    ConsoleSection:
      type: object
      description: 首页的一个段落。
      required: [title, description, entries]
      properties:
        title:
          type: string
        description:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleEntry"
      additionalProperties: false

    AccountSummary:
      type: object
      description: 账户摘要。字段只增不改语义；与数据面自助查询同口径。
      required: [account, buckets, quotas, recent]
      properties:
        account:
          $ref: "#/components/schemas/AccountRef"
        buckets:
          type: array
          description: |
            可用包存量：未过期且剩余大于 0 的账本行。同单位的包相邻排列，
            不合并成每单位一条合计，因为各包的 fallback 与到期时间不同。
          items:
            $ref: "#/components/schemas/AccountBucket"
        quotas:
          type: array
          description: 生效中的窗口限额行，账户维度在前。
          items:
            $ref: "#/components/schemas/AccountQuota"
        recent:
          type: array
          description: 最近流水摘要，按写入时刻倒序；条数由 `recent` 参数决定。
          items:
            $ref: "#/components/schemas/AccountRecentUsage"
      additionalProperties: false

    AccountRef:
      type: object
      required: [id, code]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
          description: 账户业务编码。
      additionalProperties: false

    AccountBucket:
      type: object
      description: 一条可用包存量。
      required: [unit, remaining, fallback, expires_at]
      properties:
        unit:
          type: string
          description: 结算单位 `currency` / `token` / `credit`。
        remaining:
          type: string
          description: 剩余存量，十进制字符串。
        fallback:
          type: string
          description: 包扣尽后的处置 `charge_balance` / `reject`。
        expires_at:
          type: [string, "null"]
          format: date-time
          description: 到期时刻；`null` 表示不过期。
      additionalProperties: false

    AccountQuota:
      type: object
      description: 一条窗口限额及其当前窗口的已用量。
      required: [scope, metric, window_kind, period, used, limit, action, resets_at]
      properties:
        scope:
          type: string
          description: 限额维度 `account` 或 `api_key`。
        metric:
          type: string
          description: 计量指标。
        window_kind:
          type: string
          description: 窗口类型 `rolling` / `calendar`。
        period:
          type: string
          description: 窗口周期 `5h` / `day` / `week` / `month` / `total`。
        used:
          type: string
          description: 当前窗口已用量，十进制字符串。
        limit:
          type: string
          description: 限额，十进制字符串。
        action:
          type: string
          description: 超限处置 `reject` / `throttle`。
        resets_at:
          type: [string, "null"]
          format: date-time
          description: 当前窗口结束时刻；`null` 表示不会自然重置（total）。
      additionalProperties: false

    AccountRecentUsage:
      type: object
      description: 一条流水摘要。
      required: [model, created_at, charged_amount]
      properties:
        model:
          type: string
        created_at:
          type: string
          format: date-time
        charged_amount:
          type: string
          description: 本次应扣量，十进制字符串。
      additionalProperties: false

    ApiKey:
      type: object
      description: 一把 API 密钥的可见部分；哈希与明文从不出现。
      required: [id, name, key_prefix, enabled, expires_at, last_used_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        key_prefix:
          type: string
          description: 明文前缀，仅供展示与检索。
        enabled:
          type: boolean
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
      additionalProperties: false

    PageOfApiKey:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
      additionalProperties: false

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        expires_at:
          type: [string, "null"]
          format: date-time
          description: 过期时刻；`null` 或省略表示不过期。
      additionalProperties: false

    CreatedApiKey:
      type: object
      description: 创建响应；`secret` 只在此处出现一次。
      required: [id, name, key_prefix, enabled, expires_at, last_used_at, secret]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        key_prefix:
          type: string
        enabled:
          type: boolean
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        secret:
          type: string
          description: 密钥明文，仅本次响应返回，不落库、不再查询。
      additionalProperties: false

    UsageTokens:
      type: object
      description: 一次调用的 token 用量分量。子项包含于主计数：缓存读写属于输入，推理属于输出。
      required: [input_tokens, output_tokens, cache_read_tokens, cache_write_tokens,
        cache_write_5m_tokens, cache_write_1h_tokens, reasoning_tokens, server_tool_uses]
      properties:
        input_tokens:
          type: integer
          description: 输入 token 总数，含缓存读写。
        output_tokens:
          type: integer
          description: 输出 token 总数，含推理。
        cache_read_tokens:
          type: integer
        cache_write_tokens:
          type: integer
          description: 不分档的缓存写计数；与两个分档字段互斥使用。
        cache_write_5m_tokens:
          type: integer
        cache_write_1h_tokens:
          type: integer
        reasoning_tokens:
          type: integer
        server_tool_uses:
          type: integer
          description: 服务端工具执行次数，按次计费，不是 token 计数。
      additionalProperties: false

    UsageItem:
      type: object
      description: 一条用量流水。
      required: [id, model, upstream_model, protocol, cross_protocol, usage, charged_amount, created_at]
      properties:
        id:
          type: integer
          format: int64
        model:
          type: string
          description: 客户端请求的模型名。
        upstream_model:
          type: string
          description: 实际履约的模型名。
        protocol:
          type: string
          description: 客户端使用的线协议。
        cross_protocol:
          type: boolean
        usage:
          $ref: "#/components/schemas/UsageTokens"
        charged_amount:
          type: string
          description: 本次应扣量，十进制字符串。
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    PageOfUsageItem:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageItem"
      additionalProperties: false

    UsageStatsItem:
      type: object
      description: 一个分组维度的用量合计。
      required: [key, calls, usage, charged_amount]
      properties:
        key:
          type: string
          description: |
            分组值：`day` 为日期（`YYYY-MM-DD`），`model` 为客户端请求的模型名，
            `api_key` 为密钥 id 的十进制文本。
        calls:
          type: integer
          description: 区间内成功履约的请求次数，与流水明细的行数一致。
        usage:
          $ref: "#/components/schemas/UsageTokens"
        charged_amount:
          type: string
          description: 应扣量合计：逐行「基础价 × 倍率」相加，十进制字符串。
      additionalProperties: false

    PageOfUsageStatsItem:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageStatsItem"
      additionalProperties: false

    ModelInfo:
      type: object
      description: 一个当前账户可调用的模型。
      required: [name, protocols]
      properties:
        name:
          type: string
          description: 客户端可用的模型名，可直接用于请求体。
        protocols:
          type: array
          description: 支持调用的线协议标识。
          items:
            type: string
      additionalProperties: false

    PageOfModelInfo:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"
      additionalProperties: false

    RequestItem:
      type: object
      description: 一条请求记录的摘要与归属层字段。
      required: [request_id, created_at, status, http_status, upstream_status, failure_class,
        error_code, duration_ms, model, upstream_model, protocol, upstream_protocol,
        cross_protocol, api_key_id, usage, payload_available]
      properties:
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [success, failed, cancelled]
          description: 请求终态。
        http_status:
          type: integer
          description: 返回给客户端的 HTTP 状态码。
        upstream_status:
          type: [integer, "null"]
          description: 上游返回的状态码；未取得时为 `null`。
        failure_class:
          type: [string, "null"]
          description: 失败分类；成功时为 `null`。
        error_code:
          type: [string, "null"]
          description: 网关错误码；成功时为 `null`。
        duration_ms:
          type: integer
          description: 上游调用耗时，不含向客户端写出的耗时。
        model:
          type: string
          description: 客户端请求的模型名。
        upstream_model:
          type: string
          description: 实际发往上游的模型名；与 `model` 不同表示网关改写过。
        protocol:
          type: string
          description: 客户端使用的线协议。
        upstream_protocol:
          type: string
          description: 本次请求发往上游的线协议。
        cross_protocol:
          type: boolean
          description: 两侧协议是否不同，即本次是否发生跨协议重建。
        api_key_id:
          type: integer
          format: int64
          description: 签发本次调用的密钥 id，可按它过滤。
        usage:
          oneOf:
            - $ref: "#/components/schemas/UsageTokens"
            - type: "null"
          description: 取得的 token 用量；未取得时为 `null`。
        payload_available:
          type: boolean
          description: |
            是否存在可取的脱敏报文。仅失败请求保留报文，且只保留 7 天，
            其余情况为 `false`。
        stream:
          type: boolean
          description: 本次是否为流式请求。
        written_bytes:
          type: integer
          description: 已写给客户端的响应体字节数。
      additionalProperties: false

    PageOfRequestItem:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestItem"
      additionalProperties: false

    RequestStatsItem:
      type: object
      description: 一个分组维度的请求计数。
      required: [key, total, success, failed, cancelled]
      properties:
        key:
          type: string
          description: |
            分组值：`day` 为日期（`YYYY-MM-DD`），`model` 为模型名，`status` 为终态。
        total:
          type: integer
        success:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
      additionalProperties: false

    RequestStatsPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestStatsItem"
      additionalProperties: false

    RequestAttempt:
      type: object
      description: 一次上游尝试。重试、渠道回退各占一条，按尝试序号排列。
      required: [attempt, outcome, upstream_status, failure_class, error_code,
        cross_protocol, duration_ms]
      properties:
        attempt:
          type: integer
          description: 尝试序号，从 1 起。
        outcome:
          type: string
          enum: [ok, failed, cancelled, skipped]
        upstream_status:
          type: [integer, "null"]
        failure_class:
          type: [string, "null"]
        error_code:
          type: [string, "null"]
        cross_protocol:
          type: boolean
        duration_ms:
          type: integer
      additionalProperties: false

    RedactedPayload:
      type: object
      description: |
        脱敏后的报文结构。键名与嵌套层次原样保留，值按规则处理：请求参数白名单保留
        真值；用户内容替换为 `{"__redacted": "<类型>", "len": <长度>}`；数组保留
        元素形状，元素数超过采样上限时补 `__total` 给出实际数量。

        原文从不落盘，本结构可解析、可对比，用于判定请求形状与参数是否符合预期，
        但不含用户数据。
      additionalProperties: true

    RequestDetail:
      type: object
      description: 一条请求记录的完整视图。
      required: [request, attempts, request_shape, upstream_request_shape,
        error_response_shape, rewritten_parts, client_ip, user_agent]
      properties:
        request:
          $ref: "#/components/schemas/RequestItem"
        attempts:
          type: array
          description: 尝试时间线，按尝试序号排列。
          items:
            $ref: "#/components/schemas/RequestAttempt"
        request_shape:
          oneOf:
            - $ref: "#/components/schemas/RedactedPayload"
            - type: "null"
          description: 脱敏后的客户端请求结构；无报文时为 `null`。
        upstream_request_shape:
          oneOf:
            - $ref: "#/components/schemas/RedactedPayload"
            - type: "null"
          description: |
            脱敏后实际发往上游的请求结构。与 `request_shape` 的差异即网关改写的部分：
            模型名替换、协议重建、报文改写。无报文时为 `null`。
        error_response_shape:
          oneOf:
            - $ref: "#/components/schemas/RedactedPayload"
            - type: "null"
          description: 脱敏后的错误响应结构；成功请求或超期后为 `null`。
        rewritten_parts:
          type: array
          description: 网关对报文做过的改写标注，按出现顺序排列；未改写时为空数组。
          items:
            type: string
        client_ip:
          type: string
          description: |
            客户端地址。取自连接层，存在反向代理时为代理地址；客户端可影响其取值，
            只作排障线索，不作为安全判定依据。
        user_agent:
          type: string
          description: |
            客户端自报的 User-Agent，按上限截断；未自报时为空串。可伪造，
            只作排障线索。
      additionalProperties: false

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 起；缺省 1。
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数；缺省 20，上限 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Since:
      name: since
      in: query
      required: false
      description: 起始时刻（含），RFC3339；缺省不限。
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      required: false
      description: 结束时刻（含），RFC3339；缺省不限。
      schema:
        type: string
        format: date-time
    ModelFilter:
      name: model
      in: query
      required: false
      description: 按模型名精确匹配；缺省不过滤。
      schema:
        type: string
    ApiKeyFilter:
      name: api_key_id
      in: query
      required: false
      description: 按签发本次调用的密钥 id 过滤；缺省不过滤。
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: 参数缺失或非法，`code=400`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Unauthorized:
      description: 未登录、会话失效或凭据错误，`code=401`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    ChallengeExpired:
      description: 一次性加密公钥已失效，`code=410`；重新获取公钥后重试一次。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    TooManyRequests:
      description: 触发频率限制，`code=429`。
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Forbidden:
      description: 已登录但无权访问该资源，`code=403`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    NotFound:
      description: 资源不存在或不属于当前账户，`code=404`；两者不作区分，避免探测他人资源。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Conflict:
      description: 状态冲突，`code=409`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    InternalError:
      description: 服务端错误，`code=500`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
