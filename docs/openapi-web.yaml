      description: |
        列出全部上游凭据，与 `tokenmp admin credential list --json` 同一份行数据。
        只给脱敏前缀与形态，明文与 secret JSON 任何端点都不返回。
        请求方须持有管理面能力，越权返回 `code=403`。
      operationId: listAdminCredentials
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 凭据清单。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfAdminCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [admin]
      summary: 写入上游凭据
      description: |
        写入一行上游凭据，与 `tokenmp admin credential add` 调用同一份业务实现，
        secret 以 `{"api_key": …}` 承载。请求体里的 `api_key` 是明文，只在写入这一条
        路径出现；写入响应不回显明文，读取永远只有脱敏前缀。

        订阅型上游的 OAuth 登录需要设备码轮询等交互过程，不是单次请求能完成的动作，
        不在本端点：它仍走 `tokenmp admin credential oauth-login`。

        请求方须持有管理面能力，越权返回 `code=403`。
      operationId: createAdminCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminCredentialRequest"
      responses:
        "200":
          description: 写入成功，`data.id` 是新行主键。
          content:
            application/json:
              schema:
                allOf:
