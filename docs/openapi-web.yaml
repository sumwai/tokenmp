openapi: 3.1.0

# TokenMP Web 页面通信契约。
#
# 职责：浏览器前端页面与服务端之间的全部通信。页面调用的端点只允许出现在本文件；
# 数据面（模型转发与账户自助查询）在 docs/openapi.yaml，两者不混写。
#
# 单一事实源：接口路径、请求/响应字段、状态码与业务码以本文件为准。前端的响应类型与
# 客户端一律由本文件生成，禁止手写；实现变更必须在同一 PR 内同步本文件。
#
# 路径段用单词，不使用连字符复合词（signin / signup / signout / challenge / otp）。
#
# 信封：所有端点共用 {code, data, message, page, size, total} 六字段信封。
# 字段名统一 snake_case，与仓库既有 JSON 序列化风格一致。
info:
  title: TokenMP Web 页面通信
  version: "0"
  description: |
    页面通信与数据面的分界：

    - 本文件（`/api/v1/*`）：浏览器页面调用的会话、账户、业务数据端点；
    - `docs/openapi.yaml`（`/v1/*`、`/v1beta/*`、`/healthz`）：模型转发与账户自助查询，
      由模型客户端与集成调用，页面不直接调用。

    信封语义：

    - `code` 业务结果码，程序按它分支：`200` 成功，其余为失败；
      HTTP 状态码表达传输层结果，两者在成功时一致，失败时以 `code` 为准；
      `message` 面向用户的文案，程序不得按它分支。
    - `data` 业务数据，结构由各端点声明；无数据时省略或 `null`。
    - `page` / `size` / `total` 分页信息，仅列表端点填充，其余端点为 `null`。
      `page` 从 1 起，`size` 为每页条数，`total` 为总条数。

    业务码取值：

    | code | 含义 |
    |---|---|
    | 200 | 成功 |
    | 400 | 参数缺失或非法 |
    | 401 | 未登录、会话失效或凭据错误 |
    | 402 | 账户无可用额度，按账户页的存量与引导区块充值或购买 |
    | 403 | 已登录但无权访问 |
    | 404 | 资源不存在或登录方式未启用 |
    | 409 | 状态冲突（邮箱已注册等） |
    | 410 | 一次性加密公钥失效，重新获取后重试 |
    | 429 | 触发频率限制 |
    | 500 | 服务端错误 |

    密码不传明文，流程按客户端指纹串起：

    1. 客户端持有本地生成的 `fingerprint`（在本地持久化，随每次请求带回）；
    2. 调 `GET /api/v1/auth/challenge?fingerprint=…` 换取一次性公钥，
       服务端以该指纹为索引保存私钥，同一指纹再次获取会覆盖旧值；
    3. 用 RSA-OAEP（SHA-256）加密密码，提交密文与同一 `fingerprint`；
    4. 私钥取出即失效，密钥过期或已用返回 `code=410`，客户端重新执行 2-3 后重试一次。

    登录方式：账号密码（signin / signup）与第三方 OAuth（Google、GitHub 等，
    经 `providers` 列出、`oauth` 跳转、`exchange` 换取会话）。注销账号（erase）
    与重置密码（reset）各自需要对应用途的 OTP。

    路径分区：

    - `/api/v1/auth/*`：认证面，注册、登录、会话、密码与第三方登录。
    - `/api/v1/user/*`：用户级业务数据。作用域由会话推导，不接受账户 id 参数；
      一个登录主体拥有一个账户（`account.owner_user_id`），密钥、用量与请求记录
      都挂在该账户上。列表端点用偏移分页，分页信息在信封的 `page` / `size` / `total`。
    - `/api/v1/partner/*`：商家面。作用域由会话推导出的商家给定（`merchant.owner_user_id`），
      不接受商家 id 参数；上游账号（渠道与凭据）的自助登记、启停与列表，以及名下渠道的
      调用量与应扣量都挂在这里。非本商家的资源一律 `404`，不以 403 区分存在性。
    - `/api/v1/admin/*`：管理面。平台管理员的只读清单（渠道、凭据、模型映射、商家、
      账户、价格、限额、调账与流水）与上游账号的配置动作（商家、渠道、凭据、模型映射）。
      清单字段与 `tokenmp admin <组> list --json` 的行一致；配置动作与 `tokenmp admin`
      的同名子命令调用同一份业务实现，页面与 CLI 不会各算一套。请求方须持有管理面能力，
      越权返回 `code=403`。
servers:
  - url: http://localhost:8080
    description: 默认监听地址来自 `TOKENMP_LISTEN`，未配置时为 `:8080`。

tags:
  - name: auth
    description: 注册、登录、会话与密码管理
  - name: oauth
    description: 第三方登录
  - name: user
    description: 用户级业务数据：账户概览、密钥、用量、请求记录与模型目录
  - name: admin
    description: 管理面：清单与上游账号的配置动作（商家、渠道、凭据、模型映射）
  - name: partner
    description: 商家域：上游账号（渠道与凭据）的自助管理与名下调用量

# 默认端点需要会话令牌；公开端点逐个置空。
security:
  - webSession: []

paths:
  /api/v1/auth/challenge:
    get:
      tags: [auth]
      summary: 获取一次性密码加密公钥
      description: |
        注册、登录与改密前调用。以 `fingerprint` 为索引生成一对一次性密钥，
        同一指纹重复获取会覆盖旧密钥；私钥取出即失效。同一来源受频率限制，
        超限返回 `code=429`。
      operationId: getAuthChallenge
      security: []
      parameters:
        - name: fingerprint
          in: query
          required: true
          description: 客户端本地持久化的指纹，作为一次性密钥的索引。
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        "200":
          description: 公钥获取成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChallengeData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/signin:
    post:
      tags: [auth]
      summary: 登录
      description: |
        校验账号与密码并签发会话。密码必须是经 `challenge` 公钥加密后的 base64 密文，
        且 `fingerprint` 与取公钥时一致。账号不存在、密码错误、账号停用一律返回
        `code=401` 且文案一致，不区分失败原因；`code=410` 表示密钥已失效，
        重新取公钥后重试一次。
      operationId: signin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninRequest"
      responses:
        "200":
          description: 登录成功，签发会话令牌。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/ChallengeExpired"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/signup:
    post:
      tags: [auth]
      summary: 注册
      description: |
        创建账号并在同一事务内开户，随后签发会话。密码经 `challenge` 公钥加密；
        邮箱已存在返回 `code=409`。是否开放注册由服务端配置决定，
        关闭时返回 `code=403`。
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: 注册成功，签发会话令牌。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 注册入口已关闭，`code=403`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "409":
          description: 邮箱或用户名已被使用，`code=409`，两者不作区分。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "410":
          $ref: "#/components/responses/ChallengeExpired"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新会话令牌
      description: 用刷新令牌换发新的访问令牌；刷新令牌一次性轮换，旧值同时作废。
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 换发成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AccessTokenData"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/session:
    get:
      tags: [auth]
      summary: 查询当前会话身份
      description: |
        返回当前登录身份、角色与已绑定的第三方登录方式，前端据此渲染导航清单与首页段落；
        角色与权限的真相在服务端，前端不硬编码角色取值。
      operationId: getAuthSession
      responses:
        "200":
          description: 会话有效。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/signout:
    post:
      tags: [auth]
      summary: 登出
      description: 吊销当前会话令牌；重复调用同样返回成功。
      operationId: signout
      responses:
        "200":
          description: 登出成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/otp:
    post:
      tags: [auth]
      summary: 发送一次性验证码
      description: |
        向账号绑定邮箱发送一次性验证码（OTP），`purpose` 区分用途：
        `reset` 用于重置密码，`erase` 用于注销账号。无论邮箱是否存在都返回成功，
        避免通过响应差异枚举账号；同一来源受频率限制。
      operationId: sendAuthOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: 已受理（邮箱不存在时不发信但同样返回成功）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/erase:
    post:
      tags: [auth]
      summary: 注销账号
      description: |
        注销当前登录账号。提交经 `purpose=erase` 获取的 OTP 验证身份；
        成功后该账号立即不可登录，全部会话与刷新令牌失效，重复调用返回 `code=401`。
        账号标识与关联数据的保留策略由部署方配置决定。
      operationId: eraseAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EraseRequest"
      responses:
        "200":
          description: 注销成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/reset:
    post:
      tags: [auth]
      summary: 重置密码
      description: |
        校验邮箱与 OTP 后设置新密码，新密码经 `challenge` 公钥加密。
        成功后该账号的全部会话与刷新令牌失效，需重新登录。
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetRequest"
      responses:
        "200":
          description: 重置成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/ChallengeExpired"

  /api/v1/auth/password:
    put:
      tags: [auth]
      summary: 修改密码
      description: |
        已登录下调用，校验当前密码后设置新密码。当前密码与新密码各经一次
        `challenge` 取公钥加密，分别携带对应的 `fingerprint`。
        成功后除当前会话外的全部会话失效。
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: 修改成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/ChallengeExpired"

  /api/v1/auth/providers:
    get:
      tags: [oauth]
      summary: 列出可用登录方式
      description: 返回启用中的第三方登录提供方，前端据此渲染登录页的第三方入口。
      operationId: listAuthProviders
      security: []
      responses:
        "200":
          description: 登录方式列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/AuthProvider"

  /api/v1/auth/oauth/{provider}:
    get:
      tags: [oauth]
      summary: 获取第三方授权跳转地址
      description: |
        返回提供方的授权页地址（含服务端签发的 `state`），客户端整页跳转；
        `state` 在换取会话时原样带回并由服务端校验。提供方未启用返回 `code=404`。
      operationId: getAuthOauthUrl
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: 提供方标识，取值来自 `providers` 端点（如 `google`、`github`）。
          schema:
            type: string
      responses:
        "200":
          description: 授权地址。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [authorize_url, state]
                        properties:
                          authorize_url:
                            type: string
                            format: uri
                          state:
                            type: string
                        additionalProperties: false
        "404":
          description: 提供方不存在或未启用，`code=404`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/v1/auth/oauth/{provider}/exchange:
    post:
      tags: [oauth]
      summary: 用第三方授权码换取会话
      description: |
        回调落在前端路由后，客户端把提供方返回的 `code` 与 `state` 提交到本端点；
        服务端校验 `state`、向提供方换 token、按邮箱匹配或创建账号并在同一事务内开户，
        随后签发会话。提供方未启用返回 `code=404`，`state` 不匹配返回 `code=400`。
      operationId: exchangeAuthOauth
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code:
                  type: string
                  description: 提供方回调带到前端的授权码。
                state:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: 换取成功，签发会话令牌。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: 提供方不存在或未启用，`code=404`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ------------------------------------------------------------------
  # 用户级业务数据：作用域由会话推导，路径不接受账户 id。
  # ------------------------------------------------------------------
  /api/v1/user/console:
    get:
      tags: [user]
      summary: 控制台清单
      description: |
        返回当前登录主体可用的控制台清单：底部导航项、首页段落与能力集合。
        角色与权限的真相在服务端：清单按角色生成，只包含当前主体确实持有的条目
        （条目所需的能力不在 `capabilities` 里时该条目不出现），前端按清单渲染，
        不硬编码角色取值。

        `capabilities` 的取值：`console` 控制台首页、`keys` 密钥自助管理、
        `requests` 请求记录、`usage` 用量与应扣量、`account` 账户概览、
        `purchase` 充值 / 购买、`ops` 管理面。取值只增不改语义，未识别的取值前端忽略。
      operationId: getUserConsole
      responses:
        "200":
          description: 控制台清单。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ConsoleData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/account:
    get:
      tags: [user]
      summary: 账户概览
      description: |
        返回当前登录主体所属账户的摘要：账户标识、可用包存量、生效中的窗口限额与最近流水。
        与数据面的账户自助查询（`docs/openapi.yaml` 的 `/v1/me/account`）口径一致，
        差别只在鉴权与作用域推导；判定复用同一份实现，展示与判定不会漂移。
        账户无可用额度（`settlement.Fundable` 判定为否）时回 `402`，与数据面同一门闸；
        页面据此把 402 分支渲染成充值 / 购买引导。
        响应不含密钥、上游凭据或商家内部标识。
      operationId: getUserAccount
      parameters:
        - name: recent
          in: query
          required: false
          description: 最近流水条数；缺省 10，超过 100 截到 100，`0` 表示不返回流水。
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 10
      responses:
        "200":
          description: 账户摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AccountSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/products:
    get:
      tags: [user]
      summary: 商品目录
      description: |
        列出可购买的商品档位：名称、结算单位、每份数量、售价、可用模型范围与有效天数。
        数量与售价都是十进制字符串；`model_scope` 为 `null` 表示不限模型。
        目录不分页，但分页三字段照填：档位是运营上架的有限集合，与模型目录同一形状。
      operationId: listUserProducts
      responses:
        "200":
          description: 商品目录。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/orders:
    get:
      tags: [user]
      summary: 订单列表
      description: |
        列出当前账户的订单，按购买时刻倒序。每笔订单记录买了哪个商品档位、几份、
        实付金额与派生的存量；金额、数量与折算率都是十进制字符串，不经浮点。
      operationId: listUserOrders
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 订单列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [user]
      summary: 下单购买
      description: |
        购买一个商品档位：写入购买事实并派生账本，存量、有效期与折算率按档位口径生成。
        归属由会话推导，不接受账户或商家参数。

        幂等：请求必须携带客户端生成的 `idempotency_key`，服务端以
        `(账户, idempotency_key)` 唯一。同一键重复提交（双击、超时重试）只产生一笔订单，
        响应返回首次创建的那笔订单，不重复发放存量。键在账户内唯一，不同账户可用同一个键；
        同一键用于不同的商品或份数时同样返回首次订单，不按本次请求重新下单。
      operationId: createUserOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: 订单；幂等命中时是首次创建的那笔。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/keys:
    get:
      tags: [user]
      summary: 密钥列表
      description: |
        列出当前账户下的 API 密钥，按主键倒序。只返回密钥前缀，哈希与明文从不返回。
      operationId: listUserKeys
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: enabled
          in: query
          required: false
          description: 按启用状态过滤；缺省不过滤。
          schema:
            type: boolean
      responses:
        "200":
          description: 密钥列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [user]
      summary: 创建密钥
      description: |
        为当前账户签发一把 API 密钥。明文只在本次响应出现一次，之后任何端点都不再返回；
        列表只给出前缀。密钥归属固定为当前账户，不接受归属参数。
      operationId: createUserKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "200":
          description: 创建成功，响应携带一次性明文。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/keys/{id}/revoke:
    post:
      tags: [user]
      summary: 吊销密钥
      description: |
        吊销一把属于当前账户的密钥；已吊销的密钥再次吊销同样返回成功。
        不属于当前账户的密钥返回 `code=404`，不以 403 区分存在性。
      operationId: revokeUserKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: 吊销成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/usage:
    get:
      tags: [user]
      summary: 用量流水
      description: |
        列出当前账户的用量流水，按写入时刻倒序。流水是 append-only 的计费事实，
        一次请求一行；被重试过的失败尝试不产生流水。
      operationId: listUserUsage
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/ApiKeyFilter"
      responses:
        "200":
          description: 用量流水。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfUsageItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/usage/stats:
    get:
      tags: [user]
      summary: 用量聚合
      description: |
        按维度把区间内的用量与应扣量合计起来，用于回答趋势与「花在哪了」。

        分组维度 `day` 取日期（`YYYY-MM-DD`，按写入时刻所在的自然日）、`model` 取客户端
        请求的模型名、`api_key` 取密钥 id 的十进制文本。合计与流水明细同源：同一组过滤
        参数下，明细逐行相加应等于本端点的合计。

        它只回答合计，不返回单条流水；看某次调用的明细走用量流水端点。
      operationId: getUserUsageStats
      parameters:
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: group_by
          in: query
          required: false
          description: 分组维度；缺省 `day`。
          schema:
            type: string
            enum: [day, model, api_key]
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/ApiKeyFilter"
      responses:
        "200":
          description: 聚合合计，按 `key` 升序。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfUsageStatsItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/models:
    get:
      tags: [user]
      summary: 可用模型
      description: |
        列出当前账户可调用的模型及其支持的线协议。模型可用性由渠道与模型映射决定，
        响应只给出客户端可用的模型名，不含上游模型名与渠道标识。
      operationId: listUserModels
      responses:
        "200":
          description: 模型列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfModelInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/requests:
    get:
      tags: [user]
      summary: 请求记录
      description: |
        列出当前账户的请求记录，按请求时刻倒序。粒度是客户端发起的一次请求：
        重试过的失败尝试不单独成行，因此条数与实际调用次数一致。

        记录只覆盖摘要层与归属层字段。渠道标识、上游标识、商家标识与上游错误详情
        不对用户暴露；这些字段属于商家面与管理面的统计口径。
      operationId: listUserRequests
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/ApiKeyFilter"
        - name: status
          in: query
          required: false
          description: 按终态过滤；缺省不过滤。
          schema:
            type: string
            enum: [success, failed, cancelled]
        - name: request_id
          in: query
          required: false
          description: 按请求标识精确匹配，用于定位单条记录。
          schema:
            type: string
      responses:
        "200":
          description: 请求记录。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfRequestItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/requests/{request_id}:
    get:
      tags: [user]
      summary: 请求详情
      description: |
        按请求标识返回单条记录的完整视图：摘要与归属层字段、尝试时间线，以及脱敏后的
        请求结构与错误响应结构。

        报文按「落盘即脱敏」处理：原文从不落盘，只有键名、嵌套结构与参数真值被保留，
        用户内容替换为带长度的类型标记。因此报文可解析、可对比，但不含用户数据。

        成功请求不保留报文，`request_shape` 与 `error_response_shape` 为 `null`；
        报文只保留 7 天，超期后同样为 `null`。这两点由 `payload_available` 显式区分：
        为 `false` 表示本次没有可取的报文，而不是接口异常。
      operationId: getUserRequest
      parameters:
        - name: request_id
          in: path
          required: true
          description: 请求标识，取自列表端点。
          schema:
            type: string
      responses:
        "200":
          description: 请求详情。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/user/requests/stats:
    get:
      tags: [user]
      summary: 请求记录聚合
      description: |
        按维度聚合当前账户的请求计数，用于回答时间跨度上的趋势与错误率。

        明细超过保留期后进入归档，本端点的数据源是随明细同步维护的按天聚合缓存，
        因此超期区间同样可查，不触发回源归档；区间内明细尚在热表时，两者口径一致。

        它只回答计数，不返回单条记录；按 `request_id` 定位具体请求走详情端点。
      operationId: getUserRequestStats
      parameters:
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: group_by
          in: query
          required: false
          description: 分组维度；缺省 `day`。
          schema:
            type: string
            enum: [day, model, status]
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/ApiKeyFilter"
      responses:
        "200":
          description: 聚合计数，按 `key` 升序。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RequestStatsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/merchants:
    get:
      tags: [admin]
      summary: 商家清单
      description: |
        列出全部商家，与 `tokenmp admin merchant list --json` 同一份行数据。
        渠道与凭据的写入都要给出归属商家，页面据此取候选；平台自营与入驻商家
        都是这里的行，`kind` 只是数据。请求方须持有管理面能力，越权返回 `code=403`。
      operationId: listAdminMerchants
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 商家清单。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfAdminMerchant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [admin]
      summary: 新建商家
      description: |
        新建一个商家，与 `tokenmp admin merchant create` 调用同一份业务实现。新建一律
        `active`，停用是独立动作。平台自营与入驻商家走同一条路径，`kind` 只是数据。
        请求方须持有管理面能力，越权返回 `code=403`。
      operationId: createAdminMerchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminMerchantRequest"
      responses:
        "200":
          description: 新建成功，`data.id` 是新行主键。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminResourceID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/merchants/{id}/disable:
    post:
      tags: [admin]
      summary: 停用商家
      description: |
        按主键置停用位，与 `tokenmp admin merchant disable` 同一动作。动作幂等；
        行不因此被删除，名下渠道、凭据与历史流水仍指向它。
        请求方须持有管理面能力，越权返回 `code=403`。
      operationId: disableAdminMerchant
      parameters:
        - $ref: "#/components/parameters/AdminResourceID"
      responses:
        "200":
          description: 已置位。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/merchants/{id}/owner:
    post:
      tags: [admin]
      summary: 绑定商家归属主体
      description: |
        把商家绑定到一个登录主体，与 `tokenmp admin merchant set-owner` 同一动作。
        归属是商家域（`/api/v1/partner/*`）唯一的作用域来源：没有绑定的商家在页面上没有
        主人，绑定后该登录主体才能自助管理它的上游账号。归属一对一，重复绑定返 `code=409`。
        请求方须持有管理面能力，越权返回 `code=403`。
      operationId: setAdminMerchantOwner
      parameters:
        - $ref: "#/components/parameters/AdminResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAdminMerchantOwnerRequest"
      responses:
        "200":
          description: 已绑定。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/channels:
    get:
      tags: [admin]
      summary: 渠道清单
      description: |
        列出全部上游渠道，与 `tokenmp admin channel list --json` 同一份行数据。
        渠道的 `config` 不回显：探针请求头里可能有鉴权 token。
        请求方须持有管理面能力，越权返回 `code=403`。
      operationId: listAdminChannels
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 渠道清单。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageOfAdminChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [admin]
      summary: 新建渠道
      description: |
        新建一条上游渠道，与 `tokenmp admin channel create` 调用同一份业务实现。
        新建一律启用，启用位由后续动作改动。`priority` / `weight` 缺省取 100：0 会让渠道
        永远排在最后，因此不作为「未配置」的取值。`cred_group` 只是分组名，凭据要另行写入。

        `config` 是渠道级扩展配置原文（静态请求头与探针声明），必须是 JSON 对象；
        非对象、`headers` 不是字符串到字符串的对象、或占用了网关自身请求头的头名，
        都在写入时返回 `code=400`（读取侧对这些情况是宽容的，写入口是唯一能显式拦下的地方）。

        请求方须持有管理面能力，越权返回 `code=403`。
      operationId: createAdminChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminChannelRequest"
      responses:
        "200":
          description: 新建成功，`data.id` 是新行主键。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminResourceID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
